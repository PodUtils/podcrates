# The fuzz targets of the crates of podcrates (cargo-fuzz, libFuzzer;
# docs/design.md, section 8, step 4; T-017). README.md lists each target,
# its crate and its source, and the targets that wait for their crate.
#
# A workspace of its own: the root workspace excludes this directory, so
# the library crates do not build libFuzzer's C++. A run needs a nightly
# Rust and glibc (scripts/fuzz.sh); a check needs stable Rust and a C++
# compiler:
#
#   cargo check --manifest-path fuzz/Cargo.toml --bins
#   cargo test --manifest-path fuzz/Cargo.toml --lib

[package]
name = "podcrates-fuzz"
description = "The fuzz targets of the parsers of podcrates, for cargo-fuzz and libFuzzer."
version = "0.0.0"
edition = "2024"
license = "0BSD"
publish = false

[package.metadata]
cargo-fuzz = true

[workspace]
members = ["."]

[dependencies]
libfuzzer-sys = "0.4"
pod-core = { path = "../crates/pod-core" }
pod-tls = { path = "../crates/pod-tls" }
# The feature `fuzzing` exposes the SOCKS5 exchange with a scripted proxy.
pod-proxy = { path = "../crates/pod-proxy", features = ["fuzzing"] }
pod-dns = { path = "../crates/pod-dns" }
pod-broker = { path = "../crates/pod-broker" }
# The feature `fuzzing` makes the reader of the relay's messages public.
pod-gsr = { path = "../crates/pod-gsr", features = ["fuzzing"] }
pod-ws = { path = "../crates/pod-ws" }
pod-quic = { path = "../crates/pod-quic" }
pod-wormhole = { path = "../crates/pod-wormhole" }
pod-session = { path = "../crates/pod-session" }
# The feature `fuzzing` makes the readers of the frames, the verdict and the
# proof public; the identity of a proof's seed is pod-identity's.
pod-e2e = { path = "../crates/pod-e2e", features = ["fuzzing"] }
pod-identity = { path = "../crates/pod-identity" }
# The relay lists and the pools of a relay (podssh relay_list, relay_pool).
pod-relay = { path = "../crates/pod-relay" }
# The feature `fuzzing` gives the memfd that stands in for the memory of a
# task.
pod-hold = { path = "../crates/pod-hold", features = ["fuzzing"] }
pod-job = { path = "../crates/pod-job" }
# The expressions and the workflow files of GitHub Actions (T-251).
pod-actions-expr = { path = "../crates/pod-actions-expr" }
pod-actions-workflow = { path = "../crates/pod-actions-workflow" }
# The parsers of podvm (T-173). The feature `fuzzing` of pod-oci exposes
# the parse of a challenge of a registry.
pod-oci = { path = "../crates/pod-oci", features = ["fuzzing"] }
pod-extract = { path = "../crates/pod-extract" }
pod-enter = { path = "../crates/pod-enter" }
# The squashfs modloop of a guest kernel (T-206).
pod-guest = { path = "../crates/pod-guest" }
# The feature `fuzzing` gives the readers of a response, a cookie reply and
# a transport message on fixed keys.
pod-wg = { path = "../crates/pod-wg", features = ["fuzzing"] }
# A job offer is JSON.
serde_json = "1"

# A crash names its line.
[profile.release]
debug = 1

# The stable test runs the crypto of pod-wg and pod-e2e on 2000 mutations
# of each seed. With no optimization of the crates under test, it takes
# minutes (T-206, Done).
[profile.dev.package."*"]
opt-level = 2

