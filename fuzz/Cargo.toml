# The fuzz targets of the crates of podcrates (cargo-fuzz, libFuzzer;
# docs/design.md, section 8, step 4; T-017). README.md lists each target,
# its crate and its source, and the targets that wait for their crate.
#
# A workspace of its own: the root workspace excludes this directory, so
# the library crates do not build libFuzzer's C++. A run needs a nightly
# Rust and glibc (scripts/fuzz.sh); a check needs stable Rust and a C++
# compiler:
#
#   cargo check --manifest-path fuzz/Cargo.toml --bins
#   cargo test --manifest-path fuzz/Cargo.toml --lib

[package]
name = "podcrates-fuzz"
description = "The fuzz targets of the parsers of podcrates, for cargo-fuzz and libFuzzer."
version = "0.0.0"
edition = "2024"
license = "0BSD"
publish = false

[package.metadata]
cargo-fuzz = true

[workspace]
members = ["."]

[dependencies]
libfuzzer-sys = "0.4"
pod-core = { path = "../crates/pod-core" }
pod-tls = { path = "../crates/pod-tls" }
# The feature `fuzzing` exposes the SOCKS5 exchange with a scripted proxy.
pod-proxy = { path = "../crates/pod-proxy", features = ["fuzzing"] }
pod-dns = { path = "../crates/pod-dns" }
pod-broker = { path = "../crates/pod-broker" }
# The feature `fuzzing` makes the reader of the relay's messages public.
pod-gsr = { path = "../crates/pod-gsr", features = ["fuzzing"] }
pod-ws = { path = "../crates/pod-ws" }
pod-quic = { path = "../crates/pod-quic" }
pod-wormhole = { path = "../crates/pod-wormhole" }
pod-session = { path = "../crates/pod-session" }
# The feature `fuzzing` gives the memfd that stands in for the memory of a
# task.
pod-hold = { path = "../crates/pod-hold", features = ["fuzzing"] }
pod-job = { path = "../crates/pod-job" }
# A job offer is JSON.
serde_json = "1"

# A crash names its line.
[profile.release]
debug = 1

[[bin]]
name = "one_line"
path = "fuzz_targets/one_line.rs"
test = false
doc = false
bench = false

