[workspace]
resolver = "3"
members = ["crates/*", "examples/*"]
# The fuzz targets are a workspace of their own (fuzz/Cargo.toml): the
# library crates do not build libFuzzer's C++.
exclude = ["fuzz"]

[workspace.package]
version = "0.9.0"
edition = "2024"
# The stable Rust of the day (docs/decisions.md, Toolchain). Raise it with
# rust-toolchain.toml when a new stable comes out.
rust-version = "1.99"
license = "0BSD"
repository = "https://github.com/PodUtils/podcrates"
homepage = "https://github.com/PodUtils/podcrates"

# The switch of the publish to crates.io (.github/workflows/publish.yml):
# false while the ruling Q1 stands (the consumers take the git tag; publish
# nothing). An agent sets it to true only when the owner rules so.
[workspace.metadata.podcrates]
crates-io = false

[workspace.dependencies]
# No default feature here: a crate that needs the async parts of pod-core
# (its feature `async`) names it, so that pod-tls builds with no tokio.
pod-broker = { path = "crates/pod-broker", version = "0.9.0" }
pod-core = { path = "crates/pod-core", version = "0.9.0", default-features = false }
pod-dns = { path = "crates/pod-dns", version = "0.9.0" }
pod-enter = { path = "crates/pod-enter", version = "0.9.0" }
pod-gsr = { path = "crates/pod-gsr", version = "0.9.0" }
pod-guest = { path = "crates/pod-guest", version = "0.9.0" }
pod-hostprobe = { path = "crates/pod-hostprobe", version = "0.9.0" }
pod-identity = { path = "crates/pod-identity", version = "0.9.0" }
pod-proxy = { path = "crates/pod-proxy", version = "0.9.0" }
pod-services = { path = "crates/pod-services", version = "0.9.0" }
pod-supervise = { path = "crates/pod-supervise", version = "0.9.0" }
pod-term = { path = "crates/pod-term", version = "0.9.0" }
pod-testkit = { path = "crates/pod-testkit", version = "0.9.0" }
pod-tls = { path = "crates/pod-tls", version = "0.9.0" }
tokio = { version = "1.53.3", default-features = false }
rand = { version = "0.10", default-features = false, features = ["std", "thread_rng"] }
tracing = { version = "0.1", default-features = false, features = ["std"] }
# The data files of pod-services (its build.rs, and its overlay): a TOML
# table and its values, with no writer.
toml = { version = "1", default-features = false, features = ["std", "parse", "serde"] }
# The JSON form of DNS over HTTPS (pod-dns): a document read as a value,
# with no derive.
serde_json = "1"
# The policy schema of pod-broker, and the lines of its control socket and
# its audit.
serde = { version = "1", features = ["derive"] }
# DNS over HTTPS over HTTP/2 (pod-dns), for a resolver that serves no
# HTTP/1.1: the client of h2, and the request of http.
h2 = "0.4"
http = "1"
bytes = "1"

# The raw system calls of pod-hostprobe (Linux only). linux-raw-sys gives
# the layouts of the structs of the kernel and, where syscalls does not
# build, the numbers of the calls; syscalls gives the numbers and the trap
# on the other architectures.
linux-raw-sys = { version = "0.12", default-features = false, features = ["general", "no_std"] }
syscalls = { version = "0.8", default-features = false }

# TLS with SRP (pod-gsr): rustls has no SRP cipher suite. The feature
# `vendored` builds OpenSSL from source (openssl-src), so each binary links
# it static on each target (call C34). The C of OpenSSL is in pod-gsr only.
openssl = { version = "0.10", default-features = false, features = ["vendored"] }
openssl-sys = { version = "0.9", default-features = false }
tokio-openssl = { version = "0.6", default-features = false }
# The raw pointer of an OpenSSL object (the trait of the openssl crate's
# types), for the calls that the openssl crate does not wrap.
foreign-types = "0.3"

# TLS (pod-tls). No crypto provider feature: the binary gives the provider
# (docs/design.md, section 1, rule 4). The default of tokio-rustls is
# aws_lc_rs, which needs a C compiler; it stays off.
rustls = { version = "0.23", default-features = false, features = ["std", "tls12", "logging"] }
tokio-rustls = { version = "0.26", default-features = false, features = ["logging", "tls12"] }
rustls-pki-types = "1"
# The compiled-in Mozilla roots. pod_tls::ROOTS_VERSION names the version
# that Cargo.lock holds, and a test compares them.
webpki-roots = "1"

# The pure-Rust crypto of pod-tls (feature pure), with the features of
# podssh. `zeroize` wipes the state of each hash, HMAC, AEAD and block
# cipher when it is dropped.
sha2 = { version = "0.11", default-features = false, features = ["oid", "zeroize"] }
hmac = { version = "0.13", default-features = false, features = ["zeroize"] }
hkdf = { version = "0.13", default-features = false }
aes-gcm = { version = "0.11", default-features = false, features = ["aes", "alloc", "zeroize"] }
aes = { version = "0.9", default-features = false, features = ["zeroize"] }
chacha20poly1305 = { version = "0.11", default-features = false, features = ["alloc", "zeroize"] }
x25519-dalek = { version = "3", default-features = false, features = ["static_secrets", "zeroize"] }
ed25519-dalek = { version = "2", default-features = false, features = ["std"] }
p256 = { version = "0.14", default-features = false, features = ["ecdsa", "arithmetic"] }
p384 = { version = "0.14", default-features = false, features = ["ecdsa", "arithmetic"] }
# The RSA verifier of pod-tls (feature rsa): public keys only. rsa 0.9 takes
# SHA-2 of the digest 0.10 line, under a name of its own.
rsa = { version = "0.9", default-features = false, features = ["std"] }
sha2-rsa = { package = "sha2", version = "0.10", default-features = false, features = ["oid"] }
base64 = { version = "0.23", default-features = false, features = ["std"] }
zeroize = "1"

# Debug builds keep line tables for the crates of the workspace and no
# debug info for dependencies: test binaries link with less memory and
# target/ stays smaller.
[profile.dev]
debug = "line-tables-only"

[profile.dev.package."*"]
debug = false

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 1
