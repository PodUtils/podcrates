[workspace]
resolver = "3"
members = ["crates/*", "examples/*"]
# The fuzz targets are a workspace of their own (fuzz/Cargo.toml): the
# library crates do not build libFuzzer's C++.
exclude = ["fuzz"]

[workspace.package]
version = "0.25.0"
edition = "2024"
# The stable Rust of the day (docs/decisions.md, Toolchain). Raise it with
# rust-toolchain.toml when a new stable comes out.
rust-version = "1.99"
license = "0BSD"
repository = "https://github.com/PodUtils/podcrates"
homepage = "https://github.com/PodUtils/podcrates"

# The switch of the publish to crates.io (.github/workflows/publish.yml):
# false while the ruling Q1 stands (the consumers take the git tag; publish
# nothing). An agent sets it to true only when the owner rules so.
[workspace.metadata.podcrates]
crates-io = false

[workspace.dependencies]
# No default feature here: a crate that needs the async parts of pod-core
# (its feature `async`) names it, so that pod-tls builds with no tokio.
pod-broker = { path = "crates/pod-broker", version = "0.25.0" }
pod-confine = { path = "crates/pod-confine", version = "0.25.0" }
pod-core = { path = "crates/pod-core", version = "0.25.0", default-features = false }
pod-dns = { path = "crates/pod-dns", version = "0.25.0" }
pod-e2e = { path = "crates/pod-e2e", version = "0.25.0" }
pod-enter = { path = "crates/pod-enter", version = "0.25.0" }
pod-extract = { path = "crates/pod-extract", version = "0.25.0" }
pod-gsr = { path = "crates/pod-gsr", version = "0.25.0" }
pod-guest = { path = "crates/pod-guest", version = "0.25.0" }
pod-hold = { path = "crates/pod-hold", version = "0.25.0" }
pod-hostprobe = { path = "crates/pod-hostprobe", version = "0.25.0" }
pod-identity = { path = "crates/pod-identity", version = "0.25.0" }
pod-incus = { path = "crates/pod-incus", version = "0.25.0" }
pod-job = { path = "crates/pod-job", version = "0.25.0" }
pod-netstack = { path = "crates/pod-netstack", version = "0.25.0" }
pod-oci = { path = "crates/pod-oci", version = "0.25.0" }
pod-proxy = { path = "crates/pod-proxy", version = "0.25.0" }
pod-quic = { path = "crates/pod-quic", version = "0.25.0" }
pod-relay = { path = "crates/pod-relay", version = "0.25.0" }
pod-session = { path = "crates/pod-session", version = "0.25.0" }
pod-rootfs = { path = "crates/pod-rootfs", version = "0.25.0" }
pod-services = { path = "crates/pod-services", version = "0.25.0" }
pod-supervise = { path = "crates/pod-supervise", version = "0.25.0" }
pod-term = { path = "crates/pod-term", version = "0.25.0" }
pod-testkit = { path = "crates/pod-testkit", version = "0.25.0" }
pod-tls = { path = "crates/pod-tls", version = "0.25.0" }
pod-wg = { path = "crates/pod-wg", version = "0.25.0" }
pod-wormhole = { path = "crates/pod-wormhole", version = "0.25.0" }
pod-ws = { path = "crates/pod-ws", version = "0.25.0" }
tokio = { version = "1.53.3", default-features = false }
rand = { version = "0.10", default-features = false, features = ["std", "thread_rng"] }
tracing = { version = "0.1", default-features = false, features = ["std"] }
# The data files of pod-services (its build.rs, and its overlay): a TOML
# table and its values, with no writer.
toml = { version = "1", default-features = false, features = ["std", "parse", "serde"] }
# The JSON form of DNS over HTTPS (pod-dns): a document read as a value,
# with no derive.
serde_json = "1"
# The policy schema of pod-broker, and the lines of its control socket and
# its audit; the records of pod-job.
serde = { version = "1", features = ["derive"] }
# The JSON Schemas of schemas/ that the tests of pod-job generate from its
# types (ruling Q-A8), and a validator of them. Tests only: no binary of a
# consumer carries them.
schemars = "1.2"
boon = "0.6"
# DNS over HTTPS over HTTP/2 (pod-dns), for a resolver that serves no
# HTTP/1.1: the client of h2, and the request of http.
h2 = "0.4"
http = "1"
bytes = "1"

# The raw system calls of pod-hostprobe (Linux only). linux-raw-sys gives
# the layouts of the structs of the kernel and, where syscalls does not
# build, the numbers of the calls; syscalls gives the numbers and the trap
# on the other architectures. `landlock` and `ptrace` give the rules of
# Landlock and the filter, the audit arch values and the return values of
# seccomp; `net` gives the values of `socket(2)` that a deny rule tests.
linux-raw-sys = { version = "0.12", default-features = false, features = ["general", "landlock", "net", "no_std", "ptrace"] }
syscalls = { version = "0.8", default-features = false }

# The archives of pod-extract. tar: the entry API only, no default feature
# (no xattr). flate2: the Rust backend, as the C backend complicates a static
# link. ruzstd: zstd in Rust.
tar = { version = "0.4", default-features = false }
flate2 = { version = "1", default-features = false, features = ["rust_backend"] }
ruzstd = "0.9"
# The xz of a squashfs modloop (pod-guest, call C58): a decoder in Rust with
# no unsafe code. `bcj`: some blocks of a modloop carry the x86 BCJ filter.
# No crc64 and no sha256: squashfs streams carry crc32.
xz4rust = { version = "0.2.3", default-features = false, features = ["alloc", "bcj", "no_unsafe"] }

# TLS with SRP (pod-gsr): rustls has no SRP cipher suite. The feature
# `vendored` builds OpenSSL from source (openssl-src), so each binary links
# it static on each target (call C34). The C of OpenSSL is in pod-gsr only.
openssl = { version = "0.10", default-features = false, features = ["vendored"] }
openssl-sys = { version = "0.9", default-features = false }
tokio-openssl = { version = "0.6", default-features = false }
# The raw pointer of an OpenSSL object (the trait of the openssl crate's
# types), for the calls that the openssl crate does not wrap.
foreign-types = "0.3"

# TLS (pod-tls). No crypto provider feature: the binary gives the provider
# (docs/design.md, section 1, rule 4). The default of tokio-rustls is
# aws_lc_rs, which needs a C compiler; it stays off.
rustls = { version = "0.23", default-features = false, features = ["std", "tls12", "logging"] }
tokio-rustls = { version = "0.26", default-features = false, features = ["logging", "tls12"] }
rustls-pki-types = "1"
# QUIC (pod-quic, call C43): noq with no default feature, so no ring and no
# aws-lc. The keys of an endpoint are pod-quic's, over HMAC in pure Rust.
noq = { version = "1.4", default-features = false, features = ["runtime-tokio", "rustls"] }
# The userspace stack of pod-netstack, with podnet's features: the medium ip,
# IPv4 and IPv6, TCP and UDP, the congestion controllers of WARP's --cc,
# and 32 out-of-order ranges in a TCP receive buffer (a large window with
# loss keeps the data after a hole). .cargo/config.toml sets
# SMOLTCP_IFACE_MAX_ADDR_COUNT.
smoltcp = { version = "0.14", default-features = false, features = [
    "std",
    "medium-ip",
    "proto-ipv4",
    "proto-ipv6",
    "socket-tcp",
    "socket-udp",
    "socket-tcp-reno",
    "socket-tcp-cubic",
    "assembler-max-segment-count-32",
] }
# The compiled-in Mozilla roots. pod_tls::ROOTS_VERSION names the version
# that Cargo.lock holds, and a test compares them.
webpki-roots = "1"

# The pure-Rust crypto of pod-tls (feature pure), with the features of
# podssh. `zeroize` wipes the state of each hash, HMAC, AEAD and block
# cipher when it is dropped.
sha2 = { version = "0.11", default-features = false, features = ["oid", "zeroize"] }
hmac = { version = "0.13", default-features = false, features = ["zeroize"] }
hkdf = { version = "0.13", default-features = false }
aes-gcm = { version = "0.11", default-features = false, features = ["aes", "alloc", "zeroize"] }
aes = { version = "0.9", default-features = false, features = ["zeroize"] }
chacha20poly1305 = { version = "0.11", default-features = false, features = ["alloc", "zeroize"] }
x25519-dalek = { version = "3", default-features = false, features = ["static_secrets", "zeroize"] }
ed25519-dalek = { version = "2", default-features = false, features = ["std"] }
p256 = { version = "0.14", default-features = false, features = ["ecdsa", "arithmetic"] }
p384 = { version = "0.14", default-features = false, features = ["ecdsa", "arithmetic"] }
# The RSA verifier of pod-tls (feature rsa): public keys only. rsa 0.9 takes
# SHA-2 of the digest 0.10 line, under a name of its own.
rsa = { version = "0.9", default-features = false, features = ["std"] }
sha2-rsa = { package = "sha2", version = "0.10", default-features = false, features = ["oid"] }
base64 = { version = "0.23", default-features = false, features = ["std"] }
zeroize = "1"
# WireGuard (pod-wg): ChaCha20-Poly1305 of ring (call C8: podnet's code
# stays on ring) and X25519 of curve25519-dalek, with no default feature,
# as podnet has them.
ring = "0.17"
curve25519-dalek = { version = "5", default-features = false }
# Noise of the end-to-end channel (pod-e2e), with podssh's features: pure
# Rust (ChaCha20-Poly1305, SHA-256, X25519 of curve25519-dalek, the random
# bytes of getrandom), and the raw split of the keys, which a handover gives
# the next binary. snow 0.10 takes the RustCrypto 0.10 line under it.
snow = { version = "0.10", default-features = false, features = [
    "use-chacha20poly1305",
    "use-sha2",
    "use-curve25519",
    "use-getrandom",
    "risky-raw-split",
] }

# Debug builds keep line tables for the crates of the workspace and no
# debug info for dependencies: test binaries link with less memory and
# target/ stays smaller.
[profile.dev]
debug = "line-tables-only"

[profile.dev.package."*"]
debug = false

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 1
