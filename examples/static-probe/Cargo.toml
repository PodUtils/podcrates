[package]
name = "static-probe"
description = "A binary that links each crate of podcrates with each feature, so that CI can check that it is static on each target."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
publish = false

# Each crate of the workspace, with each feature (docs/design.md, section 7).
[dependencies]
pod-broker = { workspace = true }
pod-core = { workspace = true }
pod-dns = { workspace = true, features = ["ech"] }
pod-enter = { workspace = true }
pod-extract = { workspace = true }
pod-gsr = { workspace = true, features = ["blocking"] }
pod-guest = { workspace = true }
pod-hostprobe = { workspace = true }
# `fuzzing` is out: it is for the fuzz targets of fuzz/, and no consumer turns it on.
pod-hold = { workspace = true }
pod-identity = { workspace = true }
# `schema` is out: it is for the tests that generate the JSON Schemas, and no binary turns it on.
pod-job = { workspace = true }
pod-netstack = { workspace = true }
pod-oci = { workspace = true }
# `fuzzing` is out: it is for the fuzz targets of fuzz/, and no consumer turns it on.
pod-proxy = { workspace = true, features = ["blocking", "ech"] }
pod-quic = { workspace = true }
pod-rootfs = { workspace = true }
pod-session = { workspace = true }
pod-services = { workspace = true, features = ["overlay"] }
pod-supervise = { workspace = true }
pod-term = { workspace = true }
pod-tls = { workspace = true, features = ["pure", "rsa", "ech"] }
# `plain-ws` is out: it is for the tests of an embedder, and no binary turns it on.
pod-ws = { workspace = true, features = ["ech"] }
pod-wormhole = { workspace = true }
# A runtime of one thread for the endpoint of pod-quic and the stack of
# pod-netstack, with the timer of its wait.
tokio = { workspace = true, features = ["rt", "time"] }
# The reader and the writer of the records of pod-job.
serde_json = { workspace = true }
