[package]
name = "static-probe"
description = "A binary that links each crate of podcrates with each feature, so that CI can check that it is static on each target."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
publish = false

# Each crate of the workspace, with each feature (docs/design.md, section 7).
[dependencies]
pod-actions-expr = { workspace = true }
pod-actions-workflow = { workspace = true }
pod-broker = { workspace = true }
pod-confine = { workspace = true }
pod-core = { workspace = true }
# `standin`: the probe runs a client against the stand-in on the loopback.
pod-devtunnel = { workspace = true, features = ["standin"] }
pod-dns = { workspace = true, features = ["ech"] }
# `fuzzing` is out: it is for the fuzz targets of fuzz/, and no consumer turns it on.
pod-e2e = { workspace = true }
pod-enter = { workspace = true }
pod-extract = { workspace = true }
pod-gsr = { workspace = true, features = ["blocking"] }
pod-guest = { workspace = true }
# `report`: the probe writes the report of an empty set and reads it back.
pod-hostprobe = { workspace = true, features = ["report"] }
# `fuzzing` is out: it is for the fuzz targets of fuzz/, and no consumer turns it on.
pod-hold = { workspace = true, features = ["syn-hold"] }
pod-identity = { workspace = true }
pod-incus = { workspace = true }
# `schema` is out: it is for the tests that generate the JSON Schemas, and no binary turns it on.
pod-job = { workspace = true }
# `tcp`: the probe links to itself over TLS on the loopback.
pod-link = { workspace = true, features = ["tcp"] }
pod-netlab = { workspace = true }
# `ipv4-fragmentation`: a datagram over the MTU, so that the fragmenter of
# smoltcp links in.
pod-netstack = { workspace = true, features = ["ipv4-fragmentation"] }
pod-oci = { workspace = true }
# `fuzzing` is out: it is for the fuzz targets of fuzz/, and no consumer turns it on.
pod-proxy = { workspace = true, features = ["blocking", "ech"] }
pod-quic = { workspace = true }
# `fuzzing` and `plain-ws` are out: they are for the fuzz targets of fuzz/ and
# the tests of an embedder, and no binary turns them on.
pod-relay = { workspace = true, features = ["blocking", "code", "grant", "quic"] }
pod-rootfs = { workspace = true }
pod-session = { workspace = true }
pod-services = { workspace = true, features = ["overlay"] }
pod-supervise = { workspace = true }
pod-term = { workspace = true }
pod-tls = { workspace = true, features = ["pure", "rsa", "ech"] }
# The TURN client turns on the codec of STUN (feature `stun`).
pod-turn = { workspace = true, features = ["turn"] }
# `plain-ws` is out: it is for the tests of an embedder, and no binary turns it on.
pod-ws = { workspace = true, features = ["ech", "serve"] }
pod-wormhole = { workspace = true }
# `fuzzing` is out: it is for the fuzz targets of fuzz/, and no consumer turns it on.
pod-warp = { workspace = true }
pod-wg = { workspace = true, features = ["standin"] }
# A runtime of one thread for the endpoint of pod-quic, the stack of
# pod-netstack, the hold of a SYN of pod-hold, with the timer of its wait,
# a link of pod-link with the reads and writes of its stream, and an
# allocation of pod-turn.
tokio = { workspace = true, features = ["rt", "time", "io-util"] }
# The reader and the writer of the records of pod-job.
serde_json = { workspace = true }
# The keys of a held channel of pod-e2e.
zeroize = { workspace = true }
# The provider of a MASQUE session and a capsule of pod-warp.
rustls = { workspace = true }
bytes = { workspace = true }
