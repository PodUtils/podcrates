name: services

# The watches of pod-services (crates/pod-services-watch): each [[watch]] of
# each service file against the live service, one line for each. A fact
# that moved fails the run with the file, the fact, its value, the new
# value and the source; a check that cannot hold fails it with the service
# and why. Each day at an off-peak hour, and by hand with a service or a
# kind (docs/decisions.md, C24, C42). The checks of each push do not need
# the network (ci.yml). Each day the measurements of scripts/services/ run
# too; by hand, the input measure runs one in place of the watches.
#
# A watch whose host gives no answer (a connect timeout, no route, a reset
# before the first byte) fails a scheduled run only when the last scheduled
# run had no answer of the same watch too (call C153): the first one prints
# "FAILED (first no answer)". The list of such watches of each scheduled
# run is in the cache of the job. A run by hand fails on each finding.

on:
  schedule:
    - cron: "17 2 * * *"
  workflow_dispatch:
    inputs:
      service:
        description: "Only the watches of this service id (empty: each service)"
        type: string
        default: ""
      kind:
        description: "Only the watches of this kind (empty: each kind)"
        type: string
        default: ""
      measure:
        description: "A measurement of scripts/services/ in place of the watches (none: the watches)"
        type: choice
        default: none
        options: [none, edge-facts]

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: never

jobs:
  watch:
    if: github.event_name == 'schedule' || inputs.measure == 'none'
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Toolchain
        run: sh scripts/retry.sh rustup toolchain install
      - name: Build the runner
        run: cargo build --locked --release -q -p pod-services-watch
      # The watches with no answer of the last scheduled run: the newest
      # cache of the prefix. None (the first run, a cache that expired):
      # each watch with no answer is a first one.
      - name: The watches with no answer of the last scheduled run
        if: github.event_name == 'schedule'
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: no-answer.txt
          key: services-no-answer-${{ github.run_id }}
          restore-keys: services-no-answer-
      # The token raises the limit of GitHub's API for the GitHub watches;
      # the runner sends it to api.github.com alone and never prints it.
      # A watch forward-url opens a tunnel on a free SSH relay: the daily
      # run opens one session for each relay. A run by hand opens one only
      # when it names the kind or the service (call C89).
      - name: Each watch
        id: watch
        env:
          GITHUB_TOKEN: ${{ github.token }}
          SERVICE: ${{ inputs.service }}
          KIND: ${{ inputs.kind }}
          EVENT: ${{ github.event_name }}
        run: |
          set -u
          set --
          [ -n "${SERVICE:-}" ] && set -- "$@" --service "$SERVICE"
          [ -n "${KIND:-}" ] && set -- "$@" --kind "$KIND"
          if [ "$EVENT" != schedule ] && [ -z "${SERVICE:-}" ] && [ -z "${KIND:-}" ]; then
            set -- "$@" --skip-kind forward-url
          fi
          # The runner reads the list of the last scheduled run and writes
          # the list of this run, which the next step keeps.
          if [ "$EVENT" = schedule ]; then
            if [ -f no-answer.txt ]; then mv no-answer.txt no-answer-was.txt; fi
            set -- "$@" --no-answer-was no-answer-was.txt --no-answer-now no-answer.txt
          fi
          rc=0
          ./target/release/pod-services-watch "$@" > watch.txt || rc=$?
          cat watch.txt
          {
            echo '### The watches of pod-services'
            echo
            echo '```'
            grep -E '^(MOVED|FAILED|skipped) ' watch.txt || echo "no finding"
            tail -1 watch.txt
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
          exit "$rc"
      # The list of this run, also when a watch failed. A runner that wrote
      # no list keeps no state.
      - name: Keep the watches with no answer for the next scheduled run
        if: always() && github.event_name == 'schedule' && steps.watch.outcome != 'skipped' && hashFiles('no-answer.txt') != ''
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: no-answer.txt
          key: services-no-answer-${{ github.run_id }}

  # The measurements (scripts/services/), each day and by hand: each prints
  # one line for each fact, and fails on a fact that a crate needs.
  measure:
    if: github.event_name == 'schedule' || inputs.measure == 'edge-facts'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: The facts of the edge of Cloudflare's tunnels
        run: sh scripts/services/edge-facts.sh
