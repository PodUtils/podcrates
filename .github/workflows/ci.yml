name: ci

# The checks of each push to main and each pull request (docs/design.md,
# section 9):
#
# * lint: format, clippy, docs, the build of the fuzz targets, the size of
#   the Rust files, the rules of the workflows.
# * test: the tests of the workspace on Linux x86_64, and the stable test
#   of the fuzz targets.
# * record: the tests of pod-todo, and `cargo todo check`.
# * static: the probe of each crate (examples/static-probe) on each target
#   of the consumers, and podlab of pod-lab, pod-fake-github and
#   pod-fake-githome of pod-testkit and pod-release of pod-release on each
#   Linux target, checked by scripts/check-static.sh; the strings of each by
#   scripts/check-strings.py, and the man pages of podlab and pod-release by
#   scripts/check-man.sh.
# * install: the installer core (scripts/install/test.sh) with the
#   installer of podlab as a release stamps it, against a mirror on the
#   loopback, under dash, busybox sh and bash --posix, and in the labs of
#   pod-lab that hold with no root; a skip fails.
# * all: the one status to require. It fails when a job failed or was
#   skipped.
#
# Each action is pinned by its commit. No job may write to the repository.
# The toolchain comes from rust-toolchain.toml.

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

# A newer push to the same ref cancels a run that waits or runs: a queue of
# runs for old commits holds the runners that the consumers need too.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: never
  ZIG_VERSION: 0.16.0
  ZIG_SHA256: 70e49664a74374b48b51e6f3fdfbf437f6395d42509050588bd49abe52ba3d00
  ZIGBUILD_VERSION: 0.23.4
  ZIGBUILD_SHA256: 9e3cf73485edbd45905c8aadbc0fdf869c7ddc3848f0c898229f2680db52e44b

jobs:
  lint:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Toolchain
        run: sh scripts/retry.sh rustup toolchain install
      # The crates of the lock files from the cache of this job (T-355,
      # call C152): no download of a crate that a run before took.
      - name: The cache of the registry
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.cargo/registry/index
            ~/.cargo/registry/cache
            ~/.cargo/git/db
          key: cargo-${{ runner.os }}-${{ github.job }}-${{ hashFiles('Cargo.lock', 'fuzz/Cargo.lock') }}
          restore-keys: cargo-${{ runner.os }}-${{ github.job }}-
      - name: Format
        run: cargo fmt --all --check
      - name: Clippy
        run: cargo clippy --locked --workspace --all-targets --all-features -- -D warnings
      - name: Docs
        run: RUSTDOCFLAGS="-D warnings" cargo doc --locked --no-deps --workspace --all-features
      # A synchronous consumer (podvm) takes pod-core and pod-tls with no
      # default feature, so with no tokio (T-063).
      - name: The crates with no tokio
        run: cargo clippy --locked -p pod-core -p pod-tls --no-default-features --features pod-tls/pure,pod-tls/rsa -- -D warnings
      # Each crate alone with its default features, as a consumer takes it
      # (T-870): the steps above turn on each feature.
      - name: Each crate with its default features
        run: sh scripts/ci/each-crate.sh
      # The fuzz targets (fuzz/, a workspace of its own, which the steps
      # above do not read) build on stable Rust; the build script of
      # libFuzzer needs the C++ compiler of the runner. No --locked:
      # fuzz/Cargo.lock follows the root lock file when a version of the
      # workspace changes. fuzz.yml runs the targets.
      - name: The fuzz targets build
        run: |
          set -eu
          cargo fmt --manifest-path fuzz/Cargo.toml --check
          cargo check --manifest-path fuzz/Cargo.toml --bins
          cargo clippy --manifest-path fuzz/Cargo.toml --all-targets -- -D warnings
      - name: The size of the Rust files
        run: |
          python3 -I scripts/check-size.py
          python3 -I scripts/check-size.py --self-test
      - name: No bind of a fixed loopback port in product code
        run: |
          python3 -I scripts/check-loopback.py
          python3 -I scripts/check-loopback.py --self-test
      - name: No narrative history in the documents
        run: |
          python3 -I scripts/check-history.py
          python3 -I scripts/check-history.py --self-test
      # The checkout has no tag: the check fetches the tag of its base alone.
      - name: Each change of a schema has a row, and a change that needs a new id has one
        run: python3 -I scripts/check-schemas.py
      # The writer of the release index (T-104) gives the index that the
      # tests of pod-release read, and refuses each bad input.
      - name: The watchers of the sessions
        run: |
          python3 -I scripts/agent/watch.py --self-test
          python3 -I scripts/agent/runs.py --self-test
      - name: The writer of the release index
        run: python3 -I scripts/release-index.py --self-test
      - name: No new repeated work (clones, twin entries, repeated paragraphs, the deps of design.md)
        run: |
          python3 -I scripts/codegraph.py dups
          python3 -I scripts/codegraph.py --self-test
      - name: No replace of a file outside the durable helper
        run: |
          python3 -I scripts/check-private-replace.py
          python3 -I scripts/check-private-replace.py --self-test
      - name: The measured results of each crate
        run: |
          python3 -I scripts/check-results.py
          python3 -I scripts/check-results.py --self-test
      - name: The rules of check-strings.py
        run: python3 -I scripts/check-strings.py --self-test
      - name: The rules of the workflows
        run: python3 scripts/check-workflows.py
      - name: The repository table and the table of crates match the tree
        run: python3 -I scripts/check-design-paths.py
      - name: cargo publish --workspace can order the crates
        run: |
          python3 -I scripts/check-publish-order.py
          python3 -I scripts/check-publish-order.py --self-test
      - name: The static probes cover each feature
        run: python3 -I scripts/check-probe.py
      # The second reader of the wire vectors, from docs/wire.md alone; with
      # --plant, one changed byte of each file must be found.
      - name: The wire vectors agree with docs/wire.md
        run: |
          python3 -I scripts/check-wire-vectors.py
          python3 -I scripts/check-wire-vectors.py --plant
      - name: Each planted defect applies to the tree
        run: sh scripts/plant-each.sh --apply

  test:
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Toolchain
        run: sh scripts/retry.sh rustup toolchain install
      # The crates of the lock files from the cache of this job (T-355,
      # call C152): no download of a crate that a run before took.
      - name: The cache of the registry
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.cargo/registry/index
            ~/.cargo/registry/cache
            ~/.cargo/git/db
          key: cargo-${{ runner.os }}-${{ github.job }}-${{ hashFiles('Cargo.lock', 'fuzz/Cargo.lock') }}
          restore-keys: cargo-${{ runner.os }}-${{ github.job }}-
      - name: Test
        run: cargo test --locked --workspace --all-features
      # The step above turns the feature ipv4-fragmentation of pod-netstack
      # on. With no feature, the stack refuses a datagram over the MTU and
      # drops an inbound IPv4 fragment (T-258): its tests run here.
      - name: pod-netstack with no feature
        run: cargo test --locked -p pod-netstack --lib
      # The MQTT meeting point of pod-wormhole against Eclipse Mosquitto
      # with a listener of MQTT over a WebSocket (T-261): the image of
      # images/mosquitto/, pinned to a digest. A skip fails the step.
      - name: pod-wormhole against Eclipse Mosquitto
        run: sh scripts/ci/mosquitto-tests.sh
      # The meeting point of pod-wormhole at a WebTorrent tracker against
      # webtorrent/bittorrent-tracker 11.2.3 on 127.0.0.1 (T-551): the
      # packages of scripts/ci/bittorrent-tracker/package-lock.json, each
      # by its integrity hash, from npm with no install scripts. A skip
      # fails the step.
      - name: pod-wormhole against webtorrent/bittorrent-tracker
        run: sh scripts/ci/tracker-tests.sh
      # The meeting point of pod-wormhole at an ntfy server against ntfy's
      # own server on 127.0.0.1 (T-554): the release of ntfy 2.37.2, a
      # static binary, checked by its SHA-256. A skip fails the step.
      - name: pod-wormhole against ntfy
        run: sh scripts/ci/ntfy-tests.sh
      # The Piping Server carrier of pod-piping against nwtgck's two servers
      # on 127.0.0.1 (T-032): piping-server 1.12.9 from the packages of
      # scripts/ci/piping-server/package-lock.json, each by its integrity
      # hash, and the release of piping-server-rust 0.18.0, a static binary,
      # checked by its SHA-256. A test that did not run fails the step.
      - name: pod-piping against nwtgck's Piping Servers
        run: sh scripts/ci/piping-tests.sh
      # The pairing by a code against magic-wormhole's own mailbox server and
      # library on 127.0.0.1 (T-354): the packages of
      # scripts/ci/wormhole-servers.txt, each with its SHA-256, from PyPI. A
      # skip fails the step.
      - name: The cache of pip
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cache/pip
          key: pip-${{ runner.os }}-${{ hashFiles('scripts/ci/wormhole-servers.txt') }}
      - name: pod-wormhole and pod-relay against magic-wormhole's mailbox server
        run: sh scripts/ci/mailbox-tests.sh
      # The DNS over HTTPS of pod-dns against CoreDNS on 127.0.0.1 (T-350):
      # the release of CoreDNS 1.15.0, checked by its SHA-256. A skip fails
      # the step.
      - name: pod-dns against CoreDNS
        run: sh scripts/ci/coredns-tests.sh
      # The proof of pod-tpm against swtpm and against the simulator of the
      # reference on 127.0.0.1 (T-1222): swtpm and libtpms of Ubuntu 24.04,
      # each pinned by its version and SHA-256 (scripts/ci/swtpm.sh), and
      # microsoft/ms-tpm-20-ref built from the commit of its tag v1.83r1,
      # bound to 127.0.0.1. A skip fails the step; the step prints the time
      # of TPM2_CreatePrimary on each.
      - name: pod-tpm against swtpm and ms-tpm-20-ref
        run: |
          sh scripts/retry.sh sudo apt-get update
          sh scripts/retry.sh sudo apt-get install -y --no-install-recommends autoconf-archive libssl-dev
          sh scripts/ci/tpm-tests.sh
      # The client of pod-oci against the CNCF distribution registry on
      # 127.0.0.1 (T-353): the release of distribution 3.1.2, checked by its
      # SHA-256; htpasswd and token auth, an index of two platforms that the
      # test pushes. A skip fails the step.
      - name: pod-oci against the distribution registry
        run: sh scripts/ci/registry-tests.sh
      # The s3 carrier of pod-link against SeaweedFS on 127.0.0.1 (T-623): the
      # release of SeaweedFS 4.53, checked by its SHA-256; a bucket and a
      # made-up key that the script gives the server. A skip fails the step.
      - name: pod-link against SeaweedFS
        run: sh scripts/ci/s3-tests.sh
      # The Erlang/OTP and the Elixir of the .tool-versions of xturn, for the
      # step below (T-631, call C587); mix of Elixir gets Hex and rebar3.
      - name: Erlang/OTP 29.0.5 and Elixir 1.20.3
        uses: erlef/setup-beam@54075bcc5e249e4758d363f27d099f55d843f124 # v1.24.1
        with:
          otp-version: "29.0.5"
          elixir-version: "1.20.3-otp-29"
          version-type: strict
      # Go for the step below (T-980): the version of the tool cache of the
      # runner, so no download.
      - name: Go 1.26.11
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: "1.26.11"
          cache: false
      # The clients of a job through the TLS end of pod-broker (T-973, T-980):
      # curl, git, Python with urllib, requests and pip, Node.js 26.13.1, npm,
      # cargo, Go, Java, Deno 2.9.8, the Google Cloud CLI of the runner and
      # Hex of the step of Erlang/OTP above, each with the bundle of the job,
      # against a far end on 127.0.0.1. requests from
      # scripts/ci/broker-clients.txt with each SHA-256, and the archives of
      # Node.js and Deno checked by their SHA-256. A skip fails the step.
      - name: pod-broker with the clients of a job
        run: sh scripts/ci/broker-clients-tests.sh
      # The TURN client of pod-turn over UDP and over TLS with the options of
      # T-381, and the STUN codec of pod-proxy, against coturn on 127.0.0.1
      # (T-380, T-358): the image of images/coturn/, pinned to a digest, with
      # a made-up user and a certificate that the script makes, and a second
      # coturn that redirects to the first. The SHA-256 credentials against
      # libjuice and xturn, each built from its source at a pinned commit
      # (T-403, T-631). A skip fails the step.
      - name: pod-turn and pod-proxy against coturn, libjuice and xturn
        run: sh scripts/ci/turn-tests.sh
      # The drop of the capabilities of a root payload (T-221) skips as
      # another user: run that test as root, and fail on a skip.
      - name: The tests of pod-confine as root
        run: sh scripts/ci/root-confine-tests.sh
      # A unit of the system on the systemd of the runner (T-1027): an
      # install with DynamicUser=yes and a credential, its state, and its
      # removal. The test skips as another user: run it as root, and fail on
      # a skip.
      - name: The install of a unit of the system of pod-unit as root
        run: sh scripts/ci/root-unit-tests.sh
      # The confinement through the rungs with a chroot of pod-enter (the
      # tmpfs of the namespace rung, T-227) skips as another user too. The
      # acceptance test of the overlay root (T-486) needs a static busybox.
      - name: The confinement tests of pod-enter as root
        run: |
          set -eu
          sh scripts/retry.sh sudo apt-get update
          sh scripts/retry.sh sudo apt-get install -y --no-install-recommends busybox-static
          sh scripts/ci/root-enter-confine-tests.sh
      # The namespace rung of pod-enter and its leg in pod-hostprobe for a
      # user with no capabilities (T-670): the user of the runner, after
      # the AppArmor sysctl of Ubuntu that keeps capabilities out of a user
      # namespace is set to 0. A skip line fails the step.
      - name: The namespace rung through a user namespace
        run: sh scripts/ci/userns-tests.sh
      # The proofs of a mode that a user keeps (the set-id bits, the
      # S_ISGID that the kernel drops, a closed tree, a closed etc: T-614)
      # start a worker of uid 1000 only as root, and skip the proof as the
      # user of the runner: they run as root. GNU tar as root over a
      # directory that a newer layer closed (T-1295) runs there too. A skip
      # line fails the step.
      - name: The tests of pod-extract and pod-rootfs with a worker of uid 1000
        run: sh scripts/ci/root-uid1000-tests.sh
      # The netns tests of pod-hold skip for a user here (no user
      # namespace): they run as root. A line SKIP: fails the step.
      - name: Netns tests as root
        run: sh scripts/root-netns-tests.sh
      # Each fuzz target on its seeds and on their mutations, with no
      # libFuzzer (fuzz/src/tests.rs).
      - name: The stable test of the fuzz targets
        run: cargo test --manifest-path fuzz/Cargo.toml --lib

  record:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # The parent of the commit: a citation that a change left behind.
          fetch-depth: 2
          persist-credentials: false
      - name: Toolchain
        run: sh scripts/retry.sh rustup toolchain install
      # The crates of the lock files from the cache of this job (T-355,
      # call C152): no download of a crate that a run before took.
      - name: The cache of the registry
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.cargo/registry/index
            ~/.cargo/registry/cache
            ~/.cargo/git/db
          key: cargo-${{ runner.os }}-${{ github.job }}-${{ hashFiles('Cargo.lock', 'fuzz/Cargo.lock') }}
          restore-keys: cargo-${{ runner.os }}-${{ github.job }}-
      - name: The tests of the checker
        run: cargo test --locked -p pod-todo
      - name: The record agrees
        run: cargo run --locked -q -p pod-todo -- check
      - name: No citation left behind by the last commit
        if: github.event_name == 'push'
        run: cargo run --locked -q -p pod-todo -- check --base HEAD~1

  static:
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 40
    strategy:
      fail-fast: false
      matrix:
        include:
          - { target: x86_64-unknown-linux-musl, runner: ubuntu-24.04, zig: true }
          - { target: aarch64-unknown-linux-musl, runner: ubuntu-24.04, zig: true }
          - { target: armv7-unknown-linux-musleabihf, runner: ubuntu-24.04, zig: true }
          - { target: arm-unknown-linux-musleabihf, runner: ubuntu-24.04, zig: true }
          - { target: riscv64gc-unknown-linux-musl, runner: ubuntu-24.04, zig: true }
          - { target: i686-unknown-linux-musl, runner: ubuntu-24.04, zig: true }
          - { target: loongarch64-unknown-linux-musl, runner: ubuntu-24.04, zig: true }
          - { target: powerpc64le-unknown-linux-musl, runner: ubuntu-24.04, zig: true }
          # The arm64 probe builds on the Intel runner: no runner of the label
          # macos-15 took the job in runs of a day (T-943). The check reads the
          # Mach-O header, and nightly.yml runs the tests on arm64.
          - { target: aarch64-apple-darwin, runner: macos-15-intel, zig: false }
          - { target: x86_64-apple-darwin, runner: macos-15-intel, zig: false }
          - { target: x86_64-pc-windows-msvc, runner: windows-2025, zig: false }
          - { target: aarch64-pc-windows-msvc, runner: windows-11-arm, zig: false }
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Toolchain and target
        run: |
          sh scripts/retry.sh rustup toolchain install
          sh scripts/retry.sh rustup target add ${{ matrix.target }}
      # The crates of the lock files from the cache of this job (T-355,
      # call C152): no download of a crate that a run before took.
      - name: The cache of the registry
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.cargo/registry/index
            ~/.cargo/registry/cache
            ~/.cargo/git/db
          key: cargo-${{ runner.os }}-${{ github.job }}-${{ hashFiles('Cargo.lock', 'fuzz/Cargo.lock') }}
          restore-keys: cargo-${{ runner.os }}-${{ github.job }}-
      # The archives of zig and cargo-zigbuild from the cache, each one
      # checked by its SHA-256 (T-355): no build of cargo-zigbuild.
      - name: The cache of zig and cargo-zigbuild
        if: matrix.zig
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ${{ runner.temp }}/tools/*.tar.xz
            ${{ runner.temp }}/tools/bin/*.tar.xz
          key: zig-${{ env.ZIG_SHA256 }}-${{ env.ZIGBUILD_SHA256 }}
      - name: zig and cargo-zigbuild
        if: matrix.zig
        run: sh scripts/ci/zig-tools.sh "$RUNNER_TEMP/tools"
      - name: Build the probe (zig)
        if: matrix.zig
        # One build for each probe: a build of both would turn tokio on in
        # the lean one.
        run: |
          set -eu
          for p in static-probe static-probe-lean; do
            cargo zigbuild --locked --release --target ${{ matrix.target }} -p "$p"
          done
          # The binary podlab of pod-lab (Linux only), with its feature cli.
          # SOURCE_DATE_EPOCH: the date of its man page, the time of the commit.
          SOURCE_DATE_EPOCH=$(git log -1 --format=%ct) \
            cargo zigbuild --locked --release --target ${{ matrix.target }} -p pod-lab --features cli --bin podlab
          # The fake GitHub of pod-testkit that a consumer's CI pins.
          cargo zigbuild --locked --release --target ${{ matrix.target }} -p pod-testkit --features github \
            --bin pod-fake-github
          # The fake of githome's source of jobs that podrunner's CI pins.
          cargo zigbuild --locked --release --target ${{ matrix.target }} -p pod-testkit --features githome \
            --bin pod-fake-githome
          # The verifier of a release that the CI of a product and an installer run.
          SOURCE_DATE_EPOCH=$(git log -1 --format=%ct) \
            cargo zigbuild --locked --release --target ${{ matrix.target }} -p pod-release --features cli --bin pod-release
      # The OpenSSL of pod-gsr builds from source: its Configure needs a
      # perl of Windows, not the perl of Git Bash.
      - name: A perl for OpenSSL
        if: runner.os == 'Windows'
        run: sh scripts/openssl-perl.sh
      - name: Build the probe
        if: '!matrix.zig'
        run: |
          set -eu
          for p in static-probe static-probe-lean; do
            cargo build --locked --release --target ${{ matrix.target }} -p "$p"
          done
      - name: llvm-objdump for a PE file
        if: runner.os == 'Windows'
        run: |
          sh scripts/retry.sh rustup component add llvm-tools
          host=$(rustc -vV | sed -n 's/^host: //p')
          sysroot=$(cygpath -u "$(rustc --print sysroot)")
          ls "$sysroot/lib/rustlib/$host/bin/"
          echo "OBJDUMP=$sysroot/lib/rustlib/$host/bin/llvm-objdump.exe" >> "$GITHUB_ENV"
      - name: The probe is static
        run: |
          set -eu
          for p in static-probe static-probe-lean; do
            exe=target/${{ matrix.target }}/release/$p
            # Git Bash finds NAME.exe for a test of NAME: look for the .exe first.
            if [ -f "$exe.exe" ]; then exe="$exe.exe"; fi
            sh scripts/check-static.sh "$exe"
            echo "| ${{ matrix.target }} $p | $(wc -c < "$exe") bytes |" >> "$GITHUB_STEP_SUMMARY"
          done
      - name: podlab is static
        if: matrix.zig
        run: |
          set -eu
          exe=target/${{ matrix.target }}/release/podlab
          sh scripts/check-static.sh "$exe"
          echo "| ${{ matrix.target }} podlab | $(wc -c < "$exe") bytes |" >> "$GITHUB_STEP_SUMMARY"
      - name: pod-fake-github is static
        if: matrix.zig
        run: |
          set -eu
          exe=target/${{ matrix.target }}/release/pod-fake-github
          sh scripts/check-static.sh "$exe"
          python3 -I scripts/check-strings.py "$exe"
          echo "| ${{ matrix.target }} pod-fake-github | $(wc -c < "$exe") bytes |" >> "$GITHUB_STEP_SUMMARY"
      - name: pod-fake-githome is static
        if: matrix.zig
        run: |
          set -eu
          exe=target/${{ matrix.target }}/release/pod-fake-githome
          sh scripts/check-static.sh "$exe"
          python3 -I scripts/check-strings.py "$exe"
          echo "| ${{ matrix.target }} pod-fake-githome | $(wc -c < "$exe") bytes |" >> "$GITHUB_STEP_SUMMARY"
      - name: pod-release is static
        if: matrix.zig
        run: |
          set -eu
          exe=target/${{ matrix.target }}/release/pod-release
          sh scripts/check-static.sh "$exe"
          python3 -I scripts/check-strings.py "$exe"
          echo "| ${{ matrix.target }} pod-release | $(wc -c < "$exe") bytes |" >> "$GITHUB_STEP_SUMMARY"
      # The text rules over the strings of the release binary (pod-manual).
      - name: The strings of podlab
        if: matrix.zig
        run: python3 -I scripts/check-strings.py target/${{ matrix.target }}/release/podlab
      # The manuals of podlab and pod-release: each prints with no pager, and
      # groff and mandoc render its man page with no warning.
      - name: The manuals of podlab and pod-release
        if: matrix.target == 'x86_64-unknown-linux-musl'
        run: |
          set -eu
          sh scripts/retry.sh sudo apt-get update
          sh scripts/retry.sh sudo apt-get install -y --no-install-recommends groff-base mandoc
          for exe in target/${{ matrix.target }}/release/podlab target/${{ matrix.target }}/release/pod-release; do
            "$exe" man --no-pager > /dev/null
            sh scripts/check-man.sh "$exe"
          done

  install:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Toolchain
        run: sh scripts/retry.sh rustup toolchain install
      - name: The cache of the registry
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.cargo/registry/index
            ~/.cargo/registry/cache
            ~/.cargo/git/db
          key: cargo-${{ runner.os }}-${{ github.job }}-${{ hashFiles('Cargo.lock', 'fuzz/Cargo.lock') }}
          restore-keys: cargo-${{ runner.os }}-${{ github.job }}-
      - name: dash, busybox and shellcheck
        run: |
          set -eu
          sh scripts/retry.sh sudo apt-get update
          sh scripts/retry.sh sudo apt-get install -y --no-install-recommends dash busybox-static shellcheck
      - name: podlab
        run: cargo build --locked --release -p pod-lab --features cli --bin podlab
      # The labs need a user namespace with capabilities: Ubuntu keeps them
      # out with kernel.apparmor_restrict_unprivileged_userns=1.
      - name: The installer in each shell and each lab
        run: |
          set -eu
          restrict=/proc/sys/kernel/apparmor_restrict_unprivileged_userns
          if [ -f "$restrict" ]; then sudo sh -c "echo 0 > $restrict"; fi
          sh scripts/install/test.sh --strict

  all:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    if: always()
    needs: [lint, test, record, static, install]
    steps:
      - name: Each job passed
        run: |
          set -eu
          for r in "${{ needs.lint.result }}" "${{ needs.test.result }}" "${{ needs.record.result }}" "${{ needs.static.result }}" "${{ needs.install.result }}"; do
            [ "$r" = success ] || { echo "a job ended: $r"; exit 1; }
          done
