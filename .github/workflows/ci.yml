name: ci

# The checks of each push to main and each pull request (docs/design.md,
# section 9):
#
# * lint: format, clippy, docs, the build of the fuzz targets, the size of
#   the Rust files, the rules of the workflows.
# * test: the tests of the workspace on Linux x86_64, and the stable test
#   of the fuzz targets.
# * record: the tests of pod-todo, and `cargo todo check`.
# * static: the probe of each crate (examples/static-probe) on each target
#   of the consumers, checked by scripts/check-static.sh.
# * all: the one status to require. It fails when a job failed or was
#   skipped.
#
# Each action is pinned by its commit. No job may write to the repository.
# The toolchain comes from rust-toolchain.toml.

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

# A newer push to the same ref cancels a run that waits or runs: a queue of
# runs for old commits holds the runners that the consumers need too.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: never
  ZIG_VERSION: 0.16.0
  ZIG_SHA256: 70e49664a74374b48b51e6f3fdfbf437f6395d42509050588bd49abe52ba3d00
  ZIGBUILD_VERSION: 0.23.4

jobs:
  lint:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Toolchain
        run: sh scripts/retry.sh rustup toolchain install
      - name: Format
        run: cargo fmt --all --check
      - name: Clippy
        run: cargo clippy --locked --workspace --all-targets --all-features -- -D warnings
      - name: Docs
        run: RUSTDOCFLAGS="-D warnings" cargo doc --locked --no-deps --workspace --all-features
      # A synchronous consumer (podvm) takes pod-core and pod-tls with no
      # default feature, so with no tokio (T-063).
      - name: The crates with no tokio
        run: cargo clippy --locked -p pod-core -p pod-tls --no-default-features --features pod-tls/pure,pod-tls/rsa -- -D warnings
      # The fuzz targets (fuzz/, a workspace of its own, which the steps
      # above do not read) build on stable Rust; the build script of
      # libFuzzer needs the C++ compiler of the runner. No --locked:
      # fuzz/Cargo.lock follows the root lock file when a version of the
      # workspace changes. fuzz.yml runs the targets.
      - name: The fuzz targets build
        run: |
          set -eu
          cargo fmt --manifest-path fuzz/Cargo.toml --check
          cargo check --manifest-path fuzz/Cargo.toml --bins
          cargo clippy --manifest-path fuzz/Cargo.toml --all-targets -- -D warnings
      - name: The size of the Rust files
        run: |
          python3 -I scripts/check-size.py
          python3 -I scripts/check-size.py --self-test
      - name: The rules of the workflows
        run: python3 scripts/check-workflows.py
      - name: The repository table and the table of crates match the tree
        run: python3 -I scripts/check-design-paths.py
      - name: cargo publish --workspace can order the crates
        run: |
          python3 -I scripts/check-publish-order.py
          python3 -I scripts/check-publish-order.py --self-test
      - name: The static probes cover each feature
        run: python3 -I scripts/check-probe.py
      - name: Each planted defect applies to the tree
        run: sh scripts/plant-each.sh --apply

  test:
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Toolchain
        run: sh scripts/retry.sh rustup toolchain install
      - name: Test
        run: cargo test --locked --workspace --all-features
      # The step above turns the feature ipv4-fragmentation of pod-netstack
      # on. With no feature, the stack refuses a datagram over the MTU and
      # drops an inbound IPv4 fragment (T-258): its tests run here.
      - name: pod-netstack with no feature
        run: cargo test --locked -p pod-netstack --lib
      # The MQTT meeting point of pod-wormhole against Eclipse Mosquitto
      # with a listener of MQTT over a WebSocket (T-261): the image of
      # images/mosquitto/, pinned to a digest. A skip fails the step.
      - name: pod-wormhole against Eclipse Mosquitto
        run: sh scripts/ci/mosquitto-tests.sh
      # The pairing by a code against magic-wormhole's own mailbox server and
      # library on 127.0.0.1 (T-354): the packages of
      # scripts/ci/wormhole-servers.txt, each with its SHA-256, from PyPI. A
      # skip fails the step.
      - name: pod-wormhole and pod-relay against magic-wormhole's mailbox server
        run: sh scripts/ci/mailbox-tests.sh
      # The DNS over HTTPS of pod-dns against CoreDNS on 127.0.0.1 (T-350):
      # the release of CoreDNS 1.15.0, checked by its SHA-256. A skip fails
      # the step.
      - name: pod-dns against CoreDNS
        run: sh scripts/ci/coredns-tests.sh
      # The drop of the capabilities of a root payload (T-221) skips as
      # another user: run that test as root, and fail on a skip.
      - name: The tests of pod-confine as root
        run: sh scripts/ci/root-confine-tests.sh
      # The confinement through the rungs with a chroot of pod-enter (the
      # tmpfs of the namespace rung, T-227) skips as another user too.
      - name: The confinement tests of pod-enter as root
        run: sh scripts/ci/root-enter-confine-tests.sh
      # The netns tests of pod-hold skip for a user here (no user
      # namespace): they run as root. A line SKIP: fails the step.
      - name: Netns tests as root
        run: sh scripts/root-netns-tests.sh
      # Each fuzz target on its seeds and on their mutations, with no
      # libFuzzer (fuzz/src/tests.rs).
      - name: The stable test of the fuzz targets
        run: cargo test --manifest-path fuzz/Cargo.toml --lib

  record:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # The parent of the commit: a citation that a change left behind.
          fetch-depth: 2
          persist-credentials: false
      - name: Toolchain
        run: sh scripts/retry.sh rustup toolchain install
      - name: The tests of the checker
        run: cargo test --locked -p pod-todo
      - name: The record agrees
        run: cargo run --locked -q -p pod-todo -- check
      - name: No citation left behind by the last commit
        if: github.event_name == 'push'
        run: cargo run --locked -q -p pod-todo -- check --base HEAD~1

  static:
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 40
    strategy:
      fail-fast: false
      matrix:
        include:
          - { target: x86_64-unknown-linux-musl, runner: ubuntu-24.04, zig: true }
          - { target: aarch64-unknown-linux-musl, runner: ubuntu-24.04, zig: true }
          - { target: armv7-unknown-linux-musleabihf, runner: ubuntu-24.04, zig: true }
          - { target: arm-unknown-linux-musleabihf, runner: ubuntu-24.04, zig: true }
          - { target: riscv64gc-unknown-linux-musl, runner: ubuntu-24.04, zig: true }
          - { target: i686-unknown-linux-musl, runner: ubuntu-24.04, zig: true }
          - { target: loongarch64-unknown-linux-musl, runner: ubuntu-24.04, zig: true }
          - { target: powerpc64le-unknown-linux-musl, runner: ubuntu-24.04, zig: true }
          - { target: aarch64-apple-darwin, runner: macos-15, zig: false }
          - { target: x86_64-apple-darwin, runner: macos-15-intel, zig: false }
          - { target: x86_64-pc-windows-msvc, runner: windows-2025, zig: false }
          - { target: aarch64-pc-windows-msvc, runner: windows-11-arm, zig: false }
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Toolchain and target
        run: |
          sh scripts/retry.sh rustup toolchain install
          sh scripts/retry.sh rustup target add ${{ matrix.target }}
      - name: zig and cargo-zigbuild
        if: matrix.zig
        run: |
          set -eu
          mkdir -p "$RUNNER_TEMP/zig"
          sh scripts/fetch-zig.sh "$ZIG_VERSION" "$ZIG_SHA256" "$RUNNER_TEMP/zig.tar.xz"
          tar -xJf "$RUNNER_TEMP/zig.tar.xz" -C "$RUNNER_TEMP/zig"
          echo "$RUNNER_TEMP/zig/zig-x86_64-linux-$ZIG_VERSION" >> "$GITHUB_PATH"
          sh scripts/retry.sh cargo install --locked --quiet cargo-zigbuild --version "$ZIGBUILD_VERSION"
      - name: Build the probe (zig)
        if: matrix.zig
        # One build for each probe: a build of both would turn tokio on in
        # the lean one.
        run: |
          set -eu
          for p in static-probe static-probe-lean; do
            cargo zigbuild --locked --release --target ${{ matrix.target }} -p "$p"
          done
      # The OpenSSL of pod-gsr builds from source: its Configure needs a
      # perl of Windows, not the perl of Git Bash.
      - name: A perl for OpenSSL
        if: runner.os == 'Windows'
        run: sh scripts/openssl-perl.sh
      - name: Build the probe
        if: '!matrix.zig'
        run: |
          set -eu
          for p in static-probe static-probe-lean; do
            cargo build --locked --release --target ${{ matrix.target }} -p "$p"
          done
      - name: llvm-objdump for a PE file
        if: runner.os == 'Windows'
        run: |
          sh scripts/retry.sh rustup component add llvm-tools
          host=$(rustc -vV | sed -n 's/^host: //p')
          sysroot=$(cygpath -u "$(rustc --print sysroot)")
          ls "$sysroot/lib/rustlib/$host/bin/"
          echo "OBJDUMP=$sysroot/lib/rustlib/$host/bin/llvm-objdump.exe" >> "$GITHUB_ENV"
      - name: The probe is static
        run: |
          set -eu
          for p in static-probe static-probe-lean; do
            exe=target/${{ matrix.target }}/release/$p
            # Git Bash finds NAME.exe for a test of NAME: look for the .exe first.
            if [ -f "$exe.exe" ]; then exe="$exe.exe"; fi
            sh scripts/check-static.sh "$exe"
            echo "| ${{ matrix.target }} $p | $(wc -c < "$exe") bytes |" >> "$GITHUB_STEP_SUMMARY"
          done

  all:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    if: always()
    needs: [lint, test, record, static]
    steps:
      - name: Each job passed
        run: |
          set -eu
          for r in "${{ needs.lint.result }}" "${{ needs.test.result }}" "${{ needs.record.result }}" "${{ needs.static.result }}"; do
            [ "$r" = success ] || { echo "a job ended: $r"; exit 1; }
          done
