name: release

# A release of podcrates (docs/design.md, section 10): a git tag vX.Y.Z of
# main, which each consumer names in its Cargo.toml, and a GitHub release
# with the notes of docs/releases/vX.Y.Z.md. With no input, a dry run that
# checks each condition and tags nothing. With the input version, it makes
# the tag and starts itself on the tag (a tag that GITHUB_TOKEN pushes
# starts no workflow). The run on the tag signs SHA256SUMS, makes the
# release and starts the dry run of publish.yml on the tag; the publish to
# crates.io is apart. Each run (the dry run too) builds the assets of
# podlab (docs/install.md): a static musl binary for x86_64 and aarch64,
# the installer podlab-install.sh with the core inline and the pins of the
# release, the offline bundle podlab-VERSION.tar.gz, the static musl
# binaries pod-fake-github-TARGET of pod-testkit (the fake GitHub of a
# consumer's CI), pod-fake-githome-TARGET (the fake of githome's source of
# jobs for podrunner's CI), pod-release-TARGET (the verifier of a release
# for the CI of a product and an installer), the release index
# release-index.json of pod-release (scripts/release-index.py) and
# SHA256SUMS; pod-release sums checks each file and the index of each run
# before the signature. The release attaches them with
# SHA256SUMS.sigstore.json, the keyless cosign signature of SHA256SUMS by
# this workflow at the tag (the form of podnet and podssh), which
# pod-release verify checks on the tag.
#
# The job image (call C789, the owner's ruling "ghcr.io"): for podlab,
# pod-fake-github, pod-fake-githome and pod-release, one FROM scratch image for each
# architecture (images/release/Dockerfile) from the files of dist/, under
# one index at ghcr.io/podutils/NAME:TAG. Each run builds both platforms
# and compares each binary with its asset. Only the run on the tag pushes
# the index, compares each pulled platform with its asset, and attests the
# provenance of the index in the registry. The job notes then writes the
# digest of each index and platform into the body of the release.

on:
  workflow_dispatch:
    inputs:
      version:
        description: "The version X.Y.Z of [workspace.package] (empty: a dry run)"
        required: false
        default: ""

permissions:
  contents: read

jobs:
  release:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    permissions:
      contents: write
      actions: write
      # The keyless signature: the OIDC token of this workflow at the tag.
      id-token: write
    env:
      VERSION: ${{ inputs.version }}
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: true
      - name: The conditions of a release
        run: |
          set -eu
          have=$(sed -n '/^\[workspace.package\]/,/^\[/s/^version = "\(.*\)"/\1/p' Cargo.toml)
          want=${VERSION:-$have}
          echo "the version of the workspace: $have; the release: $want"
          [ "$have" = "$want" ] || { echo "Cargo.toml says $have, not $want"; exit 1; }
          case $GITHUB_REF in
            refs/tags/*)
              [ "$GITHUB_REF_NAME" = "v$want" ] || { echo "the tag $GITHUB_REF_NAME is not v$want"; exit 1; }
              [ -z "$VERSION" ] || { echo "the run on a tag takes no input"; exit 1; } ;;
          esac
          if git rev-parse -q --verify "refs/tags/v$want" > /dev/null; then
            echo "the tag v$want exists: a tag never moves"
            [ -z "$VERSION" ] || exit 1
          fi
          [ -f "docs/releases/v$want.md" ] || { echo "no notes: docs/releases/v$want.md"; exit 1; }
          sha=$(git rev-parse HEAD)
          state=$(gh api "repos/$GITHUB_REPOSITORY/actions/workflows/ci.yml/runs?head_sha=$sha" \
            --jq '[.workflow_runs[] | select(.status == "completed")][0].conclusion // "none"')
          echo "ci at $sha: $state"
          [ "$state" = success ] || { echo "ci is not green at $sha"; exit 1; }
      - name: Toolchain and targets
        run: |
          sh scripts/retry.sh rustup toolchain install
          sh scripts/retry.sh rustup target add x86_64-unknown-linux-musl aarch64-unknown-linux-musl
      - name: zig and cargo-zigbuild
        run: |
          set -eu
          # The versions and the SHA-256 sums of ci.yml: one place for them.
          sed -n 's/^  \(ZIG_VERSION\|ZIG_SHA256\|ZIGBUILD_VERSION\|ZIGBUILD_SHA256\): \(.*\)$/\1=\2/p' \
            .github/workflows/ci.yml > "$RUNNER_TEMP/zig.env"
          [ "$(wc -l < "$RUNNER_TEMP/zig.env")" = 4 ] || { echo "ci.yml does not give the four values of zig"; exit 1; }
          set -a
          . "$RUNNER_TEMP/zig.env"
          set +a
          sh scripts/ci/zig-tools.sh "$RUNNER_TEMP/tools"
      - name: The assets of podlab
        run: |
          set -eu
          v=$(sed -n '/^\[workspace.package\]/,/^\[/s/^version = "\(.*\)"/\1/p' Cargo.toml)
          # The time of the commit: the same input gives the same bytes.
          SOURCE_DATE_EPOCH=$(git log -1 --format=%ct)
          export SOURCE_DATE_EPOCH
          mkdir -p dist
          for t in x86_64-unknown-linux-musl aarch64-unknown-linux-musl; do
            cargo zigbuild --locked --release --target "$t" -p pod-lab --features cli --bin podlab
            sh scripts/check-static.sh "target/$t/release/podlab"
            python3 -I scripts/check-strings.py "target/$t/release/podlab"
            cp "target/$t/release/podlab" "dist/podlab-$t"
            # The fake GitHub that a consumer's CI pins by its SHA-256.
            cargo zigbuild --locked --release --target "$t" -p pod-testkit --features github --bin pod-fake-github
            sh scripts/check-static.sh "target/$t/release/pod-fake-github"
            python3 -I scripts/check-strings.py "target/$t/release/pod-fake-github"
            cp "target/$t/release/pod-fake-github" "dist/pod-fake-github-$t"
            # The fake of githome's source that podrunner's CI pins by its SHA-256.
            cargo zigbuild --locked --release --target "$t" -p pod-testkit --features githome --bin pod-fake-githome
            sh scripts/check-static.sh "target/$t/release/pod-fake-githome"
            python3 -I scripts/check-strings.py "target/$t/release/pod-fake-githome"
            cp "target/$t/release/pod-fake-githome" "dist/pod-fake-githome-$t"
            # The verifier of a release that the CI of a product and an installer run.
            cargo zigbuild --locked --release --target "$t" -p pod-release --features cli --bin pod-release
            sh scripts/check-static.sh "target/$t/release/pod-release"
            python3 -I scripts/check-strings.py "target/$t/release/pod-release"
            cp "target/$t/release/pod-release" "dist/pod-release-$t"
          done
          python3 -I scripts/install/pins.py sums dist podlab-x86_64-unknown-linux-musl podlab-aarch64-unknown-linux-musl
          python3 -I scripts/install/pins.py stamp scripts/install/podlab.sh --version "$v" --assets dist --out dist/podlab-install.sh
          python3 -I scripts/install/pins.py bundle "dist/podlab-$v.tar.gz" "podlab-$v" \
            dist/podlab-install.sh dist/podlab-x86_64-unknown-linux-musl dist/podlab-aarch64-unknown-linux-musl
          # The release index (T-104, schemas/release-index.v1.schema.json):
          # written before SHA256SUMS, which holds its line, so that the
          # signature of SHA256SUMS signs it too.
          files=$(cd dist && ls podlab-* pod-fake-github-* pod-fake-githome-* pod-release-*)
          # shellcheck disable=SC2086 # one word for each file name.
          python3 -I scripts/release-index.py --project "$GITHUB_REPOSITORY" --version "v$v" --dir dist \
            --date "$SOURCE_DATE_EPOCH" --commit "$(git rev-parse HEAD)" --out dist/release-index.json $files
          # SHA256SUMS of each published file.
          (cd dist && sha256sum podlab-* pod-fake-github-* pod-fake-githome-* pod-release-* release-index.json > SHA256SUMS.new && mv SHA256SUMS.new SHA256SUMS)
          cat dist/SHA256SUMS
      # The check of a dry run that the CI of a product runs before its
      # signature: each file and the index against SHA256SUMS and the schema,
      # by the verifier of this release.
      - name: The files and the index against SHA256SUMS
        run: |
          set -eu
          dist/pod-release-x86_64-unknown-linux-musl sums --all dist
          cp -R dist "$RUNNER_TEMP/changed"
          printf x >> "$RUNNER_TEMP/changed/release-index.json"
          rc=0
          dist/pod-release-x86_64-unknown-linux-musl sums --all "$RUNNER_TEMP/changed" || rc=$?
          [ "$rc" = 77 ] || { echo "a changed index gave exit $rc, not 77"; exit 1; }
          rm -rf "$RUNNER_TEMP/changed"
      # The published files themselves: the installer from the bundle, then
      # a second run that changes nothing.
      - name: The published installer installs
        run: |
          set -eu
          v=$(sed -n '/^\[workspace.package\]/,/^\[/s/^version = "\(.*\)"/\1/p' Cargo.toml)
          p=$RUNNER_TEMP/podlab-prefix
          sh dist/podlab-install.sh --offline "dist/podlab-$v.tar.gz" --prefix "$p"
          sh dist/podlab-install.sh --offline "dist/podlab-$v.tar.gz" --prefix "$p" > "$RUNNER_TEMP/second.txt"
          cat "$RUNNER_TEMP/second.txt"
          grep -q 'is already installed' "$RUNNER_TEMP/second.txt"
          [ "$("$p/podlab" --version)" = "podlab $v" ]
      # The job image takes these files: the images hold the bytes of the
      # assets, with no second build.
      - name: The binaries for the images
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: dist
          path: |
            dist/podlab-*-unknown-linux-musl
            dist/pod-fake-github-*
            dist/pod-fake-githome-*
            dist/pod-release-*
            dist/SHA256SUMS
          if-no-files-found: error
      - name: The tag, and the run on the tag
        if: inputs.version != ''
        run: |
          set -eu
          git -c user.name=Azathothas -c user.email=ajamx101@gmail.com tag -a "v$VERSION" -m "podcrates v$VERSION"
          git push origin "v$VERSION"
          gh workflow run release.yml --ref "v$VERSION"
      # The run on the tag: the keyless signature of SHA256SUMS. Its identity
      # is this workflow at the tag; the check must pass with it, and fail on
      # a changed copy and on the identity of a branch.
      - if: startsWith(github.ref, 'refs/tags/v')
        uses: sigstore/cosign-installer@756fe2d284c7292c4e9b62c8a28f1e5629c59532 # v4.1.3
        with:
          cosign-release: v3.1.4
      - name: The signature of SHA256SUMS
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          set -eu
          cd dist
          cosign sign-blob --yes --bundle SHA256SUMS.sigstore.json SHA256SUMS
          issuer=https://token.actions.githubusercontent.com
          workflow="https://github.com/$GITHUB_REPOSITORY/.github/workflows/release.yml"
          check() {
            cosign verify-blob --bundle SHA256SUMS.sigstore.json --certificate-identity "$1" \
              --certificate-oidc-issuer "$issuer" "$2"
          }
          check "$workflow@$GITHUB_REF" SHA256SUMS
          awk 'NR == 1 { $0 = (substr($0, 1, 1) == "0" ? "1" : "0") substr($0, 2) } { print }' SHA256SUMS \
            > "$RUNNER_TEMP/changed"
          if check "$workflow@$GITHUB_REF" "$RUNNER_TEMP/changed"; then echo "a changed copy verified"; exit 1; fi
          if check "$workflow@refs/heads/main" SHA256SUMS; then echo "the identity of a branch verified"; exit 1; fi
          echo "signed by $workflow@$GITHUB_REF; a changed copy and the identity of a branch fail"
      # The verifier of this release over its own signed files: the bundle by
      # the identity of the tag, each file, and the index. A changed file and
      # another tag fail with exit 77.
      - name: The verifier checks the signed release
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          set -eu
          exe=dist/pod-release-x86_64-unknown-linux-musl
          "$exe" verify --repo "$GITHUB_REPOSITORY" --tag "$GITHUB_REF_NAME" --all dist
          cp -R dist "$RUNNER_TEMP/changed"
          printf x >> "$RUNNER_TEMP/changed/podlab-install.sh"
          for args in "--tag $GITHUB_REF_NAME $RUNNER_TEMP/changed" "--tag v0.0.0 dist"; do
            rc=0
            # shellcheck disable=SC2086 # the words of the arguments.
            "$exe" verify --repo "$GITHUB_REPOSITORY" $args || rc=$?
            [ "$rc" = 77 ] || { echo "verify $args gave exit $rc, not 77"; exit 1; }
          done
          rm -rf "$RUNNER_TEMP/changed"
      # The published installer checks the signature with this cosign, as
      # a user with cosign does: the files come from dist (file://).
      - name: The published installer checks the signature
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          set -eu
          PODLAB_MIRROR="file://$PWD/dist" sh dist/podlab-install.sh --prefix "$RUNNER_TEMP/signed" > "$RUNNER_TEMP/signed.txt"
          cat "$RUNNER_TEMP/signed.txt"
          grep -q 'the signature of SHA256SUMS: ok (cosign, ' "$RUNNER_TEMP/signed.txt"
      - name: Publish
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          set -eu
          gh release create "$GITHUB_REF_NAME" --verify-tag --title "podcrates $GITHUB_REF_NAME" \
            --notes-file "docs/releases/$GITHUB_REF_NAME.md" dist/*
          gh workflow run publish.yml --ref "$GITHUB_REF_NAME"

  # Call C789: the images of the release binaries on ghcr.io. A dry run
  # builds both platforms and pushes nothing, so that a broken Dockerfile
  # fails before the tag.
  image:
    needs: release
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        name: [podlab, pod-fake-github, pod-fake-githome, pod-release]
    permissions:
      contents: read
      # The push of the index, on the tag.
      packages: write
      # actions/attest: the OIDC token of this workflow at the tag, and the
      # store of the attestation.
      id-token: write
      attestations: write
    env:
      NAME: ${{ matrix.name }}
      # No summary and no artifact of buildx: the job notes reads the
      # artifacts of this run.
      DOCKER_BUILD_SUMMARY: "false"
      DOCKER_BUILD_RECORD_UPLOAD: "false"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: dist
          path: dist
      - name: The context of the image
        id: ctx
        run: |
          set -eu
          (cd dist && sha256sum -c --ignore-missing SHA256SUMS)
          v=$(sed -n '/^\[workspace.package\]/,/^\[/s/^version = "\(.*\)"/\1/p' Cargo.toml)
          tag="v$v"
          case $GITHUB_REF in refs/tags/v*) tag=$GITHUB_REF_NAME ;; esac
          repo="ghcr.io/$(echo "$GITHUB_REPOSITORY_OWNER" | tr '[:upper:]' '[:lower:]')/$NAME"
          ctx="$RUNNER_TEMP/ctx"
          mkdir -p "$ctx"
          # The names of images/release/Dockerfile: NAME-TARGETARCH.
          cp "dist/$NAME-x86_64-unknown-linux-musl" "$ctx/$NAME-amd64"
          cp "dist/$NAME-aarch64-unknown-linux-musl" "$ctx/$NAME-arm64"
          {
            echo "tag=$tag"
            echo "repo=$repo"
            echo "ctx=$ctx"
          } >> "$GITHUB_OUTPUT"
          echo "$repo:$tag from dist/$NAME-*"
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - name: The images of both platforms, as files
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: ${{ steps.ctx.outputs.ctx }}
          file: images/release/Dockerfile
          target: ${{ matrix.name }}
          platforms: linux/amd64,linux/arm64
          # The index holds the two images only; actions/attest gives the
          # provenance.
          provenance: false
          sbom: false
          labels: |
            org.opencontainers.image.source=https://github.com/${{ github.repository }}
            org.opencontainers.image.version=${{ steps.ctx.outputs.tag }}
            org.opencontainers.image.revision=${{ github.sha }}
          outputs: type=local,dest=${{ runner.temp }}/fs
      # Each run: a swapped platform or a wrong file fails before the tag.
      - name: The binary of each platform is its asset
        run: |
          set -eu
          for pair in linux_amd64:x86_64-unknown-linux-musl linux_arm64:aarch64-unknown-linux-musl; do
            got=$(sha256sum < "$RUNNER_TEMP/fs/${pair%%:*}/usr/local/bin/$NAME" | cut -d ' ' -f 1)
            want=$(sha256sum < "dist/$NAME-${pair#*:}" | cut -d ' ' -f 1)
            [ "$got" = "$want" ] || { echo "${pair%%:*}: the binary is not $NAME-${pair#*:} ($got, not $want)"; exit 1; }
            echo "${pair%%:*}: $NAME-${pair#*:}, sha256 $got"
          done
          case $GITHUB_REF in refs/tags/v*) ;; *) echo "not the run on a tag: the images are built, and nothing is pushed" ;; esac
      - name: The login to ghcr.io
        if: startsWith(github.ref, 'refs/tags/v')
        uses: docker/login-action@81c6f93d4bc991e510b342a00b419b3bb4efc5c6 # v4.7.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ github.token }}
      - name: The index, pushed
        id: push
        if: startsWith(github.ref, 'refs/tags/v')
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: ${{ steps.ctx.outputs.ctx }}
          file: images/release/Dockerfile
          target: ${{ matrix.name }}
          platforms: linux/amd64,linux/arm64
          provenance: false
          sbom: false
          labels: |
            org.opencontainers.image.source=https://github.com/${{ github.repository }}
            org.opencontainers.image.version=${{ steps.ctx.outputs.tag }}
            org.opencontainers.image.revision=${{ github.sha }}
          tags: ${{ steps.ctx.outputs.repo }}:${{ steps.ctx.outputs.tag }}
          push: true
      # Each platform of the pushed index, pulled by its digest, holds the
      # bytes of its asset. The rows go to the body of the release.
      - name: The pushed index, pulled by digest
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          REPO: ${{ steps.ctx.outputs.repo }}
          TAG: ${{ steps.ctx.outputs.tag }}
          DIGEST: ${{ steps.push.outputs.digest }}
        run: |
          set -eu
          case "$DIGEST" in sha256:*) ;; *) echo "no digest of $REPO:$TAG: $DIGEST"; exit 1 ;; esac
          tagged=$(docker buildx imagetools inspect "$REPO:$TAG" --format '{{json .Manifest}}' | jq -r .digest)
          [ "$tagged" = "$DIGEST" ] || { echo "$REPO:$TAG is $tagged, not $DIGEST"; exit 1; }
          docker buildx imagetools inspect --raw "$REPO@$DIGEST" > "$RUNNER_TEMP/index.json"
          jq . "$RUNNER_TEMP/index.json"
          platforms=$(jq -r '[.manifests[] | "\(.platform.os)/\(.platform.architecture)"] | sort | join(" ")' "$RUNNER_TEMP/index.json")
          [ "$platforms" = "linux/amd64 linux/arm64" ] || { echo "the index holds $platforms"; exit 1; }
          rows="$RUNNER_TEMP/image-$NAME.md"
          echo "| \`$REPO:$TAG\` | each | \`$DIGEST\` | | |" > "$rows"
          for pair in amd64:x86_64-unknown-linux-musl arm64:aarch64-unknown-linux-musl; do
            arch=${pair%%:*}
            asset="$NAME-${pair#*:}"
            d=$(jq -r --arg a "$arch" '.manifests[] | select(.platform.architecture == $a) | .digest' "$RUNNER_TEMP/index.json")
            docker pull -q --platform "linux/$arch" "$REPO@$d" > /dev/null
            c=$(docker create --platform "linux/$arch" "$REPO@$d")
            docker cp "$c:/usr/local/bin/$NAME" "$RUNNER_TEMP/pulled"
            docker rm "$c" > /dev/null
            got=$(sha256sum < "$RUNNER_TEMP/pulled" | cut -d ' ' -f 1)
            want=$(sha256sum < "dist/$asset" | cut -d ' ' -f 1)
            [ "$got" = "$want" ] || { echo "$REPO@$d: the binary is not $asset ($got, not $want)"; exit 1; }
            echo "$REPO@$d (linux/$arch): $asset, sha256 $got"
            echo "| | linux/$arch | \`$d\` | \`$asset\` | \`$want\` |" >> "$rows"
          done
          cat "$rows"
      - name: The provenance of the index, in the registry
        if: startsWith(github.ref, 'refs/tags/v')
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4.2.2
        with:
          subject-name: ${{ steps.ctx.outputs.repo }}
          subject-digest: ${{ steps.push.outputs.digest }}
          push-to-registry: true
          # A storage record is not part of call C789, and needs the right
          # artifact-metadata: write.
          create-storage-record: false
      - name: The provenance of the index, checked
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ steps.ctx.outputs.repo }}
          DIGEST: ${{ steps.push.outputs.digest }}
        run: |
          set -eu
          gh attestation verify "oci://$REPO@$DIGEST" --repo "$GITHUB_REPOSITORY" \
            --signer-workflow "$GITHUB_REPOSITORY/.github/workflows/release.yml"
      # A consumer pulls with no login. A new package of ghcr.io can be
      # private: a warning tells the coordinator to set it public.
      - name: The index, with no login
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          REPO: ${{ steps.ctx.outputs.repo }}
          DIGEST: ${{ steps.push.outputs.digest }}
        run: |
          set -eu
          docker logout ghcr.io
          if docker buildx imagetools inspect "$REPO@$DIGEST" > /dev/null; then
            echo "$REPO@$DIGEST: it pulls with no login"
          else
            echo "::warning::$REPO does not pull with no login: set the visibility of the package to public"
          fi
      - name: The rows of the release body
        if: startsWith(github.ref, 'refs/tags/v')
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: image-${{ matrix.name }}
          path: ${{ runner.temp }}/image-${{ matrix.name }}.md
          if-no-files-found: error

  # The digests of the images in the body of the GitHub release. The notes
  # of docs/releases/ are written before the tag, and cannot hold them. One
  # job writes the body, so the legs of image do not race.
  notes:
    needs: image
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: write
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: image-*
          path: rows
          merge-multiple: true
      - name: The images, by digest, in the release
        run: |
          set -eu
          {
            echo ""
            echo "## The images, by digest"
            echo ""
            echo "Each image is \`FROM scratch\`, with the asset at \`/usr/local/bin/NAME\` as its entrypoint."
            echo "Pull by digest: \`docker pull IMAGE@DIGEST\`."
            echo "Check the provenance of an index: \`gh attestation verify oci://IMAGE@DIGEST --repo $GITHUB_REPOSITORY\`."
            echo ""
            echo "| Image | Platform | Digest | Asset | SHA-256 of the asset |"
            echo "| --- | --- | --- | --- | --- |"
            for f in rows/image-*.md; do cat "$f"; done
          } > "$RUNNER_TEMP/images.md"
          body=$(gh release view "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" --json body --jq .body)
          # The section is the end of the body: a second run replaces it.
          printf '%s\n' "$body" | sed '/^## The images, by digest$/,$d' > "$RUNNER_TEMP/notes.md"
          body=$(cat "$RUNNER_TEMP/notes.md")
          printf '%s\n' "$body" > "$RUNNER_TEMP/notes.md"
          cat "$RUNNER_TEMP/images.md" >> "$RUNNER_TEMP/notes.md"
          gh release edit "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" --notes-file "$RUNNER_TEMP/notes.md"
          want=$(cat rows/image-*.md | wc -l)
          got=$(gh release view "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" --json body --jq .body | grep -c '^| .*sha256:')
          [ "$got" = "$want" ] || { echo "the body holds $got rows of digests, not $want"; exit 1; }
          cat "$RUNNER_TEMP/images.md"
