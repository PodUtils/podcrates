name: adoption

# The adoption trials (docs/design.md, section 8, step 7): each consumer at
# its pinned commit, with each crate of podcrates in the place of its own
# module (adoption/CONSUMER/CRATE.patch), runs its own checks and tests
# (adoption/CONSUMER/CRATE.run, through scripts/adoption.sh), and builds its
# static binary for x86_64 musl with zig. On each push that changes a crate
# or a trial, and by hand.

on:
  push:
    branches: [main]
    paths:
      - "crates/**"
      - "adoption/**"
      - "scripts/adoption.sh"
      - ".github/workflows/adoption.yml"
  workflow_dispatch:
    inputs:
      crate:
        description: "One crate (empty: each trial)"
        required: false
        default: ""

# A newer push to the same ref cancels a run that waits or runs: a queue of
# runs for old commits holds the runners that the consumers need too.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: never
  CARGO_BUILD_JOBS: "4"
  # The versions of ci.yml.
  ZIG_VERSION: 0.16.0
  ZIG_SHA256: 70e49664a74374b48b51e6f3fdfbf437f6395d42509050588bd49abe52ba3d00
  ZIGBUILD_VERSION: 0.23.4
  ZIGBUILD_SHA256: 9e3cf73485edbd45905c8aadbc0fdf869c7ddc3848f0c898229f2680db52e44b

jobs:
  adoption:
    runs-on: ubuntu-24.04
    timeout-minutes: 150
    strategy:
      fail-fast: false
      matrix:
        consumer: [podssh, podnet, podvm]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Toolchain
        run: |
          sh scripts/retry.sh rustup toolchain install
          # The checkout of a consumer has no toolchain file of its own here.
          rustup default "$(sed -n 's/^channel = "\(.*\)"/\1/p' rust-toolchain.toml)"
          sh scripts/retry.sh rustup target add x86_64-unknown-linux-musl
      # The crates of the lock files from the cache of this job (T-355,
      # call C152): no download of a crate that a run before took.
      - name: The cache of the registry
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.cargo/registry/index
            ~/.cargo/registry/cache
            ~/.cargo/git/db
          key: cargo-${{ runner.os }}-${{ github.job }}-${{ matrix.consumer }}-${{ hashFiles('Cargo.lock', 'fuzz/Cargo.lock') }}
          restore-keys: cargo-${{ runner.os }}-${{ github.job }}-${{ matrix.consumer }}-
      # The archives of zig and cargo-zigbuild from the cache, each one
      # checked by its SHA-256 (T-355): no build of cargo-zigbuild.
      - name: The cache of zig and cargo-zigbuild
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ${{ runner.temp }}/tools/*.tar.xz
            ${{ runner.temp }}/tools/bin/*.tar.xz
          key: zig-${{ env.ZIG_SHA256 }}-${{ env.ZIGBUILD_SHA256 }}
      - name: zig and cargo-zigbuild
        run: sh scripts/ci/zig-tools.sh "$RUNNER_TEMP/tools"
      - name: Each trial of the consumer
        env:
          ONE: ${{ inputs.crate }}
        run: |
          set -u
          failed=0
          ran=0
          for patch in adoption/${{ matrix.consumer }}/*.patch; do
            [ -f "$patch" ] || continue
            crate=$(basename "$patch" .patch)
            [ -z "$ONE" ] || [ "$ONE" = "$crate" ] || continue
            ran=$((ran + 1))
            echo "::group::${{ matrix.consumer }} takes $crate"
            if sh scripts/adoption.sh ${{ matrix.consumer }} "$crate" "$RUNNER_TEMP/adoption"; then
              echo "| ${{ matrix.consumer }} | $crate | passed |" >> "$GITHUB_STEP_SUMMARY"
            else
              failed=$((failed + 1))
              echo "| ${{ matrix.consumer }} | $crate | FAILED |" >> "$GITHUB_STEP_SUMMARY"
            fi
            echo "::endgroup::"
          done
          echo "trials: $ran, failed: $failed"
          test "$failed" -eq 0
