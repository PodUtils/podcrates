name: plants

# Each check must fail on a defect planted for it (scripts/plant-each.sh,
# docs/development.md). On each push to main that changes a check, a plant
# or the record tool, and by hand.

on:
  push:
    branches: [main]
    paths:
      - "scripts/**"
      - "crates/pod-todo/**"
      - "crates/pod-services/build.rs"
      - "crates/pod-services/src/schema.rs"
      - "crates/pod-services-watch/**"
      - "crates/pod-testkit/src/stand.rs"
      - "examples/static-probe*/**"
      - "TODO/todo.toml"
      - ".github/workflows/plants.yml"
  workflow_dispatch:

# A newer push to the same ref cancels a run that waits or runs: a queue of
# runs for old commits holds the runners that the consumers need too.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  plants:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Toolchain
        run: sh scripts/retry.sh rustup toolchain install
      # The plant of the convert of pod-guest runs qemu-img and qemu-io.
      - name: qemu-utils
        run: |
          set -eu
          sh scripts/retry.sh sudo apt-get update
          sh scripts/retry.sh sudo apt-get install -y --no-install-recommends qemu-utils
          qemu-img --version
      - name: Each plant is caught
        run: sh scripts/plant-each.sh
