name: nightly

# The tests of the workspace on each other platform of the consumers, each
# night, by hand, and before a release (docs/design.md, section 7): macOS
# and Windows on their runners; the other Linux targets built with
# cargo-zigbuild and run under QEMU user mode (scripts/binfmt.sh). Linux
# x86_64 runs in ci.yml on each push.

on:
  schedule:
    - cron: "17 2 * * *"
  workflow_dispatch:

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: never
  ZIG_VERSION: 0.16.0
  ZIG_SHA256: 70e49664a74374b48b51e6f3fdfbf437f6395d42509050588bd49abe52ba3d00
  ZIGBUILD_VERSION: 0.23.4

jobs:
  test:
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        runner: [macos-15, macos-15-intel, windows-2025, windows-11-arm]
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Toolchain
        run: sh scripts/retry.sh rustup toolchain install
      # The OpenSSL of pod-gsr builds from source: its Configure needs a
      # perl of Windows, not the perl of Git Bash.
      - name: A perl for OpenSSL
        if: runner.os == 'Windows'
        run: sh scripts/openssl-perl.sh
      # pod-gsr crashes with STATUS_ACCESS_VIOLATION in the handshake tests
      # on Windows ARM64 (T-131). The test of the workspace leaves it out
      # there, and the next step runs it alone, with one thread and the
      # output on, to name the test and the call.
      - name: Test
        run: |
          if [ "${{ matrix.runner }}" = windows-11-arm ]; then
            cargo test --locked --workspace --all-features --exclude pod-gsr
          else
            cargo test --locked --workspace --all-features
          fi
      - name: Test pod-gsr (Windows ARM64, open defect)
        if: matrix.runner == 'windows-11-arm'
        continue-on-error: true
        run: cargo test --locked -p pod-gsr --all-features --no-fail-fast -- --nocapture --test-threads=1
      # The store of Windows: the test's root in the machine's ROOT store
      # lets a server that it signs through with the default trust; the same
      # server with the root out of the store is the control. The root
      # leaves the store in each case. The user's ROOT store would ask its
      # user in a dialog, which a runner cannot answer.
      - name: A root in the store of Windows
        if: runner.os == 'Windows'
        shell: pwsh
        env:
          POD_TLS_TEST_STORE_ROOT: ${{ runner.temp }}\store-root.cer
        run: |
          $test = "a_server_that_the_root_signs_is_trusted_through_the_store_alone"
          cargo test --locked -p pod-tls --all-features --test system_store -- --ignored --exact the_root_is_written
          if ($LASTEXITCODE -ne 0) { exit 1 }
          $env:POD_TLS_TEST_STORE_HOLDS = "0"
          cargo test --locked -p pod-tls --all-features --test system_store -- --ignored --exact --nocapture $test
          if ($LASTEXITCODE -ne 0) { exit 1 }
          $added = Import-Certificate -FilePath $env:POD_TLS_TEST_STORE_ROOT -CertStoreLocation Cert:\LocalMachine\Root
          try {
            $env:POD_TLS_TEST_STORE_HOLDS = "1"
            cargo test --locked -p pod-tls --all-features --test system_store -- --ignored --exact --nocapture $test
            if ($LASTEXITCODE -ne 0) { exit 1 }
          } finally {
            Remove-Item -Path ("Cert:\LocalMachine\Root\" + $added.Thumbprint)
          }
      # The trust settings of macOS: a runner cannot add a root (the right
      # com.apple.trust-settings.admin needs a dialog, and granting it fails
      # as root too), so the step reads the user's and the administrator's
      # settings with no root of the test in them: a server that the root
      # signs is refused.
      - name: The trust settings of macOS, read
        if: runner.os == 'macOS'
        timeout-minutes: 15
        env:
          POD_TLS_TEST_STORE_ROOT: ${{ runner.temp }}/store-root.cer
        run: |
          set -eu
          test=a_server_that_the_root_signs_is_trusted_through_the_store_alone
          cargo test --locked -p pod-tls --all-features --test system_store -- --ignored --exact the_root_is_written
          POD_TLS_TEST_STORE_HOLDS=0 cargo test --locked -p pod-tls --all-features --test system_store -- --ignored --exact --nocapture "$test"

  cross:
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    strategy:
      fail-fast: false
      matrix:
        include:
          - { target: aarch64-unknown-linux-musl, qemu: arm64 }
          - { target: armv7-unknown-linux-musleabihf, qemu: arm }
          - { target: arm-unknown-linux-musleabihf, qemu: arm }
          - { target: riscv64gc-unknown-linux-musl, qemu: riscv64 }
          - { target: i686-unknown-linux-musl, qemu: "" }
          - { target: loongarch64-unknown-linux-musl, qemu: loong64 }
          - { target: powerpc64le-unknown-linux-musl, qemu: ppc64le }
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Toolchain and target
        run: |
          sh scripts/retry.sh rustup toolchain install
          sh scripts/retry.sh rustup target add ${{ matrix.target }}
      - name: zig and cargo-zigbuild
        run: |
          set -eu
          mkdir -p "$RUNNER_TEMP/zig"
          sh scripts/fetch-zig.sh "$ZIG_VERSION" "$ZIG_SHA256" "$RUNNER_TEMP/zig.tar.xz"
          tar -xJf "$RUNNER_TEMP/zig.tar.xz" -C "$RUNNER_TEMP/zig"
          echo "$RUNNER_TEMP/zig/zig-x86_64-linux-$ZIG_VERSION" >> "$GITHUB_PATH"
          sh scripts/retry.sh cargo install --locked --quiet cargo-zigbuild --version "$ZIGBUILD_VERSION"
      - name: QEMU for the target
        if: matrix.qemu != ''
        run: sh scripts/binfmt.sh ${{ matrix.qemu }}
      - name: Build the tests
        run: |
          set -eu
          cargo zigbuild --locked --workspace --all-features --tests --target ${{ matrix.target }} \
            --message-format=json > "$RUNNER_TEMP/build.json"
          python3 -c 'import json,sys
          for line in open(sys.argv[1]):
              m = json.loads(line) if line.startswith("{") else {}
              if m.get("reason") == "compiler-artifact" and m.get("executable") and m["profile"]["test"]:
                  print(m["manifest_path"].rsplit("/", 1)[0], m["executable"])' "$RUNNER_TEMP/build.json" > "$RUNNER_TEMP/tests.txt"
          wc -l < "$RUNNER_TEMP/tests.txt"
      - name: Run the tests
        run: |
          set -u
          failed=0
          while read -r dir exe; do
            echo "== $exe"
            (cd "$dir" && "$exe") || failed=$((failed + 1))
          done < "$RUNNER_TEMP/tests.txt"
          echo "test binaries that failed: $failed"
          test "$failed" -eq 0
