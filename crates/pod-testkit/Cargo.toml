[package]
name = "pod-testkit"
description = "The test kit of podcrates: the guards of a test host and the stand-ins of the services that the tests need."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true

[features]
# The terminal oracle (src/screen.rs) on vt100.
screen = ["dep:vt100"]
# The stand-ins of the services of other parties (src/stand.rs): std alone.
stand = []
# The HTTP/2 part of a stand-in of WARP's MASQUE front door
# (src/masque.rs): the CONNECT-IP request and its capsules, on tokio.
masque = ["dep:tokio", "dep:h2", "dep:http", "dep:bytes"]
# An address where each TCP connect is refused, held by a bound socket that
# does not listen (src/refused.rs), on tokio's TcpSocket.
refused = ["dep:tokio", "tokio/net"]
# The fake GitHub of a consumer's CI (src/github.rs) and its binary
# pod-fake-github: the App, the JIT configuration, the `workflow_job`
# webhooks and the runner broker, on the HTTP stand-in.
github = ["stand", "dep:ring", "dep:serde_json", "dep:base64", "dep:pod-time"]
# The fake of githome's source of jobs for the CI of podrunner
# (src/githome.rs) and its binary pod-fake-githome: the state and a control
# API on the HTTP stand-in, and a program of the source wire of pod-job. It
# takes the feature github: with --github, serve queues each job in a
# pod-fake-github and mints its JIT runner there as the App.
githome = ["github", "stand", "dep:serde_json", "dep:pod-job"]
# The tests of a JSON Schema that a crate generates from its types
# (src/schema.rs): the file of schemas/ against the types, and a validator
# of JSON Schema 2020-12.
schema = ["dep:boon", "dep:serde_json"]

[[bin]]
name = "pod-fake-github"
path = "src/bin/pod-fake-github.rs"
required-features = ["github"]

[[bin]]
name = "pod-fake-githome"
path = "src/bin/pod-fake-githome.rs"
required-features = ["githome"]

[dependencies]
vt100 = { version = "0.18", optional = true }
tokio = { workspace = true, optional = true, features = ["io-util", "rt", "sync"] }
h2 = { workspace = true, optional = true }
http = { workspace = true, optional = true }
bytes = { workspace = true, optional = true }
# The fake GitHub: RS256 and HMAC-SHA256 of ring, the JSON of the API, the
# base64 of a JWT and of a JIT configuration, and the UTC times of the
# webhooks (pod-time: std alone, with no dependency on this kit).
ring = { workspace = true, optional = true }
serde_json = { workspace = true, optional = true }
base64 = { workspace = true, optional = true }
pod-time = { workspace = true, optional = true }
# The fake githome: the types of the source wire and of the job offer, so
# that the fake and podrunner read one form. pod-job has no pod dependency.
pod-job = { workspace = true, optional = true }
boon = { workspace = true, optional = true }

# The probe of a user and a mount namespace (need_userns!): fork, unshare,
# mount.
[target.'cfg(target_os = "linux")'.dependencies]
libc = "0.2"
# The one detection of an emulator (host::emulated). pod-hostprobe and
# pod-core take this crate as a dev-dependency by path only, so that cargo
# publish can order them (scripts/check-publish-order.py).
pod-hostprobe = { workspace = true }
