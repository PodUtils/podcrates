[package]
name = "pod-testkit"
description = "The test kit of podcrates: the guards of a test host and the stand-ins of the services that the tests need."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true

[features]
# The terminal oracle (src/screen.rs) on vt100.
screen = ["dep:vt100"]

[dependencies]
vt100 = { version = "0.18", optional = true }

# The probe of a user and a mount namespace (need_userns!): fork, unshare,
# mount.
[target.'cfg(target_os = "linux")'.dependencies]
libc = "0.2"
