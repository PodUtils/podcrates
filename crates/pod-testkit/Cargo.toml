[package]
name = "pod-testkit"
description = "The test kit of podcrates: the guards of a test host and the stand-ins of the services that the tests need."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true

[features]
# The terminal oracle (src/screen.rs) on vt100.
screen = ["dep:vt100"]
# The stand-ins of the services of other parties (src/stand.rs): std alone.
stand = []
# The HTTP/2 part of a stand-in of WARP's MASQUE front door
# (src/masque.rs): the CONNECT-IP request and its capsules, on tokio.
masque = ["dep:tokio", "dep:h2", "dep:http", "dep:bytes"]

[dependencies]
vt100 = { version = "0.18", optional = true }
tokio = { workspace = true, optional = true, features = ["io-util", "rt", "sync"] }
h2 = { workspace = true, optional = true }
http = { workspace = true, optional = true }
bytes = { workspace = true, optional = true }

# The probe of a user and a mount namespace (need_userns!): fork, unshare,
# mount.
[target.'cfg(target_os = "linux")'.dependencies]
libc = "0.2"
# The one detection of an emulator (host::emulated). pod-hostprobe and
# pod-core take this crate as a dev-dependency by path only, so that cargo
# publish can order them (scripts/check-publish-order.py).
pod-hostprobe = { workspace = true }
