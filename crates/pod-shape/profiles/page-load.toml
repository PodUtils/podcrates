# A page load: an opening burst of large records, then small records.
name = "page-load"
protocol = "https"
rule = "first:8"
first_flight = 16384

buckets = [
  { size = 128, weight = 18 },
  { size = 512, weight = 30 },
  { size = 1024, weight = 26 },
  { size = 2048, weight = 26 },
]

pace = { rate = 4000000, jitter = 20, keepalive = 30 }

entropy = { min = 3.0, max = 7.0, printable_run = 16 }

source = { date = "2026-11-12", cover_version = "1" }
