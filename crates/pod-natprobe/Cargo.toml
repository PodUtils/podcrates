[package]
name = "pod-natprobe"
description = "A probe of the NAT on the path: the mapping and the filtering of RFC 5780, the port allocation, hairpinning, CGNAT, ALG, NAT64, NAT-PMP, PCP, UPnP, a traversal strategy and a NAT simulator. The core has no I/O."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true

[features]
default = ["run", "report"]
# The runner on tokio and the seams of the system. With no default feature, the
# state machine builds with no tokio.
run = ["dep:tokio", "dep:tracing", "pod-core/async", "dep:pod-services"]
# The JSON of the report and of the observations (serde).
report = ["dep:serde", "dep:serde_json"]
# The NAT simulator: virtual time in memory, std only, no socket.
sim = []

[dependencies]
pod-core = { workspace = true, default-features = false }
pod-turn = { workspace = true, features = ["stun"] }
pod-services = { workspace = true, optional = true }
serde = { workspace = true, optional = true }
serde_json = { workspace = true, optional = true }
tokio = { workspace = true, features = ["net", "time", "rt", "macros", "sync", "io-util"], optional = true }
tracing = { workspace = true, optional = true }

[dev-dependencies]
# The system resolver of the live test.
pod-proxy = { workspace = true }
pod-testkit = { workspace = true }
serde_json = { workspace = true }
tokio = { workspace = true, features = ["net", "time", "rt", "rt-multi-thread", "macros", "sync", "io-util", "test-util"] }

[[test]]
name = "classes"
required-features = ["sim"]

[[test]]
name = "advanced"
required-features = ["sim", "report"]

[[test]]
name = "loopback"
required-features = ["run"]

[[test]]
name = "live"
required-features = ["run"]

[[test]]
name = "regressions"
required-features = ["sim"]

[[test]]
name = "rfc5780"
required-features = ["run", "sim"]

[[test]]
name = "guards"
required-features = ["sim"]
