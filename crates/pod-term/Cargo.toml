[package]
name = "pod-term"
description = "A line discipline in user space for a host with no pty, and the grammar of a terminal's output with its ring."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true

[dependencies]
unicode-width = { version = "0.2", default-features = false }

[dev-dependencies]
# The terminal oracle of the test kit: a model terminal reads what the
# discipline writes, and the tests compare its screens.
pod-testkit = { workspace = true, features = ["screen"] }
# Property tests of the line discipline (tests/properties.rs).
proptest = { version = "1.11", default-features = false, features = ["std"] }
# A terminal's parser of another project, for the tests of where a stream of
# output may start: the state machine of vte.
anstyle-parse = "1.0.0"

# The pty of the kernel that tests/termios_kernel.rs compares with
# `termios::Tty`: posix_openpt, tcsetattr, poll.
[target.'cfg(target_os = "linux")'.dev-dependencies]
libc = "0.2"
