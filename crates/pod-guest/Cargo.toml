[package]
name = "pod-guest"
description = "A disposable QEMU guest on Linux: the boot plan on KVM or TCG, a per-run overlay, a FAT16 mailbox, a cmd.exe or DOS agent, QMP, a bounded stop, a warm start from a saved state with a fingerprint and a cold fallback, the store of a base image with its pinned digest, and the module set of a guest kernel from its squashfs modloop."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true

# Linux only: on another target the crate is empty.
[target.'cfg(target_os = "linux")'.dependencies]
pod-core = { workspace = true }
# The machine profile (KVM or TCG) and the group kill of the emulator.
pod-hostprobe = { workspace = true }
# The digest of a stored base image.
sha2 = { workspace = true }
# The xz blocks of a squashfs modloop, with the x86 BCJ filter.
xz4rust = { workspace = true }
# The connect with `O_NONBLOCK` of the QMP socket, which never waits in
# the kernel, and a socket with the queue of QEMU's monitor in the tests.
socket2 = "0.6"

[dev-dependencies]
# The HTTP stand-in of the tests of the store.
pod-testkit = { workspace = true, features = ["stand"] }
