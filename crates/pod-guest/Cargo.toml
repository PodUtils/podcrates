[package]
name = "pod-guest"
description = "A disposable QEMU guest on Linux: the boot plan on KVM or TCG, a per-run overlay, a FAT16 mailbox, a cmd.exe or DOS agent, QMP, a bounded stop, and the store of a base image with its pinned digest."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true

# Linux only: on another target the crate is empty.
[target.'cfg(target_os = "linux")'.dependencies]
pod-core = { workspace = true }
# The machine profile (KVM or TCG) and the group kill of the emulator.
pod-hostprobe = { workspace = true }
# The digest of a stored base image.
sha2 = { workspace = true }

[dev-dependencies]
pod-testkit = { workspace = true }
