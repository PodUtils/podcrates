[package]
name = "pod-egress"
description = "The roads out that are not the relay: a second proxy over TLS, the WebSocket forwarders of other products, Wisp, wstunnel, Tor's meek_lite and WebTunnel, the Access client of Cloudflare, AWS's EC2 Instance Connect Endpoint and Google's IAP for TCP; each road that takes its target from the client is a dialer, through the caller's way out."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true

[features]
default = []
# A second forward proxy over TLS, by HTTP/1.1's or HTTP/2's CONNECT.
via = ["dep:h2", "dep:http", "dep:bytes", "dep:base64", "dep:zeroize", "dep:tokio-rustls"]
# The WebSocket forwarders of other products, the built-in ones of
# pod-services among them; a template wisp+wss:// takes the Wisp road.
forwarder = ["wisp", "dep:pod-services"]
# Many TCP streams over one WebSocket, by the Wisp protocol.
wisp = []
# A server of erebe/wstunnel: the token is a JWT signed with HMAC-SHA-256.
wstunnel = ["dep:base64", "dep:zeroize", "dep:hmac", "dep:sha2"]
# Tor's meek_lite: the session id is a part of SHA-256.
meek = ["dep:sha2"]
# Tor's WebTunnel: the pin of the certificates is a chain of SHA-256.
webtunnel = ["dep:base64", "dep:sha2", "dep:tokio-rustls"]
# The road of `cloudflared access tcp`.
cloudflare = ["dep:zeroize"]
# VLESS over a WebSocket and over XHTTP (HTTP/2, or HTTP/1.1 on two
# connections): the ID of a word is a UUID of SHA-1.
vless = ["dep:h2", "dep:http", "dep:bytes", "dep:sha1", "dep:tokio-rustls", "dep:rustls-pki-types"]
# VMess's AEAD form over a WebSocket: AES-128 of its header's ID, the
# AEADs of pod-tls's pure provider, MD5 and HMAC-SHA-256 of its keys, the
# CRC-32 of its auth ID.
vmess = ["vless", "dep:aes", "dep:base64", "dep:crc32fast", "dep:hmac", "dep:md5", "dep:sha2", "pod-tls/pure"]
# Trojan over TLS and over a WebSocket: the password goes as SHA-224.
trojan = ["vless", "dep:sha2"]
# Shadowsocks's AEAD form and Shadowsocks 2022, over TCP or a WebSocket:
# the AEADs of pod-tls's pure provider, EVP_BytesToKey of MD5, HKDF-SHA1,
# BLAKE3.
shadowsocks = ["dep:base64", "dep:blake3", "dep:hkdf", "dep:md5", "dep:sha1", "dep:zeroize", "pod-tls/pure"]
# AWS's EC2 Instance Connect Endpoint: its URL is presigned with SigV4
# (HMAC-SHA-256).
eice = ["dep:zeroize", "dep:hmac", "dep:sha2"]
# Google Cloud's Identity-Aware Proxy for TCP, with its own messages, their
# acknowledgements and a session that a new link takes up.
iap = ["dep:zeroize"]
# A plain WebSocket over TCP to the loopback, for the tests of the Access
# client (cloudflare::connect_loopback). No binary turns it on.
plain-ws = ["pod-ws/plain-ws"]
# The stand-ins of the far ends of the roads (src/standin.rs): a forward
# proxy over TLS, a wstunnel server, VLESS, Trojan and Wisp servers, and with
# `shadowsocks` the servers of Shadowsocks from the specification's own
# ciphers (AES-GCM, ChaCha20-Poly1305, MD5, HKDF-SHA1, BLAKE3). For the tests
# of this crate and of a consumer; no binary needs them.
standin = [
  "dep:h2", "dep:http", "dep:bytes", "dep:base64", "dep:hmac", "dep:sha2", "dep:tokio-rustls",
  "dep:aes-gcm", "dep:chacha20poly1305", "dep:md5", "dep:hkdf", "dep:sha1", "dep:blake3",
]
# The readers of the wire for the fuzz targets of fuzz/ (src/fuzzing.rs):
# the packets of a Wisp server, the messages of IAP. No consumer turns it on.
fuzzing = ["wisp", "iap"]

[dependencies]
# The dialer, the failure and its stage and class, the events, the
# entropy, the text made safe to print, the check of a host name.
pod-core = { workspace = true, features = ["async"] }
# The way out of the caller (its dialer, its TLS context, its user agent),
# the WebSocket of each road: the frames, the upgrade, the session.
pod-ws = { workspace = true }
# The dial's error, the HTTP/1.1 heads, the authority of a host, the
# schemes of a 407.
pod-proxy = { workspace = true }
# The trust of each TLS connection, the configuration of each trust and the
# words of a failed handshake.
pod-tls = { workspace = true }
# The built-in forwarders: the services of the kind `forwarder`.
pod-services = { workspace = true, optional = true }
tokio = { workspace = true, features = ["io-util", "net", "time", "sync", "rt", "macros"] }
rustls = { workspace = true }
tracing = { workspace = true }
# The answer of a forwarder and the claims of a wstunnel token are JSON.
serde_json = { workspace = true }
tokio-rustls = { workspace = true, optional = true }
rustls-pki-types = { workspace = true, optional = true }
# HTTP/2's CONNECT of via: h2 and its types, pure Rust. It is pod-ws's h2,
# the fork pod-h2 of vendor/h2: a stream of it goes to pod_ws::h2_road.
h2 = { workspace = true, optional = true }
http = { workspace = true, optional = true }
bytes = { workspace = true, optional = true }
base64 = { workspace = true, optional = true }
zeroize = { workspace = true, optional = true }
hmac = { workspace = true, optional = true }
sha2 = { workspace = true, optional = true }
sha1 = { workspace = true, optional = true }
md5 = { workspace = true, optional = true }
hkdf = { workspace = true, optional = true }
aes = { workspace = true, optional = true }
blake3 = { workspace = true, optional = true }
# The CRC-32 of the auth ID of VMess; pure Rust.
crc32fast = { workspace = true, optional = true }
# The ciphers of the Shadowsocks stand-ins (feature `standin`), not the
# crate's own wrapper of them.
aes-gcm = { workspace = true, optional = true }
chacha20poly1305 = { workspace = true, optional = true }

[dev-dependencies]
pod-testkit = { workspace = true }
tokio = { workspace = true, features = ["io-util", "net", "time", "sync", "rt", "rt-multi-thread", "macros", "test-util"] }
# The way of the tests: TLS on ring.
rustls = { workspace = true, features = ["ring"] }
tokio-rustls = { workspace = true }
rustls-pki-types = { workspace = true }
# The certificates of the tests (pod-tls tests/common/cert_for_test.rs),
# minted in pure Rust.
p256 = { workspace = true }
# The digests of the bytes that the tests carry, and the token of a
# stand-in wstunnel server.
sha2 = { workspace = true }
hmac = { workspace = true }
base64 = { workspace = true }
zeroize = { workspace = true }
bytes = { workspace = true }
h2 = { workspace = true }
http = { workspace = true }
# The specification's own reading of Shadowsocks's streams in the tests:
# its AEADs, its keys of MD5, HKDF-SHA1 and BLAKE3.
aes-gcm = { workspace = true }
chacha20poly1305 = { workspace = true }
md5 = { workspace = true }
sha1 = { workspace = true }
hkdf = { workspace = true }
blake3 = { workspace = true }

[[test]]
name = "via"
required-features = ["via", "standin"]

[[test]]
name = "forwarder"
required-features = ["forwarder"]

[[test]]
name = "live_forwarder"
required-features = ["forwarder"]

[[test]]
name = "wisp"
required-features = ["forwarder", "standin"]

[[test]]
name = "wstunnel"
required-features = ["wstunnel", "standin"]

[[test]]
name = "meek"
required-features = ["meek"]

[[test]]
name = "webtunnel"
required-features = ["webtunnel"]

[[test]]
name = "vless"
required-features = ["vless", "standin"]

[[test]]
name = "vmess"
required-features = ["vmess", "standin"]

[[test]]
name = "trojan"
required-features = ["trojan", "standin"]

[[test]]
name = "shadowsocks"
required-features = ["shadowsocks", "standin"]

[[test]]
name = "shadowsocks_2022"
required-features = ["shadowsocks", "standin"]

[[test]]
name = "cloudflare_access"
required-features = ["cloudflare", "plain-ws"]

[[test]]
name = "eice"
required-features = ["eice"]

[[test]]
name = "iap"
required-features = ["iap"]
