[package]
name = "pod-iroh"
description = "The iroh road between two ends: QUIC between Ed25519 keys, through an iroh relay when UDP is refused, the relay's dial through the caller's proxy; a node's record of pkarr with each of its roads; the resumable layer on a stream of the connection."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true

[features]
default = []
# A relay server and a server of pkarr on the loopback, and the way out of a
# test, for the tests of this crate and of a consumer; never in a release.
test-relay = [
  "iroh/test-utils",
  "iroh-relay/server",
  "iroh-relay/test-utils",
  "dep:rcgen",
  "rustls/ring",
  "dep:tokio-rustls",
]

[dependencies]
# 1.1 or later: three advisories of 2026-10-05 affect each release up to
# 1.0.3. No default features: no port mapping (UPnP and NAT-PMP need UDP and
# a router), no metrics, no macOS fast path. `tls-ring`: ring, and no
# aws-lc, which is not proven on each target of docs/design.md (section 7);
# the endpoint takes the caller's provider all the same. Its iroh-relay is
# the copy in vendor/ with the patch that dials the relay through a SOCKS5
# proxy too (the root's [patch.crates-io]). `unstable-net-report`: the
# endpoint's report of the network, whose QUIC address discovery says that a
# datagram came back. iroh keeps that API out of its semver, so the range
# ends before 1.5: a new minor version comes as an update to read.
iroh = { version = ">=1.4.2, <1.5", default-features = false, features = ["tls-ring", "unstable-net-report"] }
# The failure types, the dial and resolver traits, the files of the keys,
# the text made safe to print, the check of a host name.
pod-core = { workspace = true, features = ["async"] }
# The resumable layer: a session on a stream, its far end and its keeper.
pod-session = { workspace = true }
# The keys of each end and the allowlist of a node, the same on each road.
pod-identity = { workspace = true }
# The DERP home of a node's record, as its ticket.
pod-derp = { workspace = true }
# The OpenTunnel name of a node's record.
pod-opentunnel = { workspace = true }
# The proxy of the relay's dial, as the caller chooses it, and one HTTP/1.1
# exchange.
pod-proxy = { workspace = true }
# The way out of each request of the crate (pkarr, `/ping`, the question of
# the version), and the WebSocket upgrade of that question.
pod-ws = { workspace = true }
# The TLS context of the binary (its provider and its roots), and the trust.
pod-tls = { workspace = true }
# The services of other parties: n0's relays and pkarr, the zone of the
# quick tunnel.
pod-services = { workspace = true }
tokio = { workspace = true, features = ["time", "sync", "rt", "macros"] }
# The types of iroh's interfaces: the relay's certificate verifier (rustls),
# the proxy's URL (url), and the resolver's errors (n0-error), at the
# versions that iroh already builds.
rustls = { workspace = true }
url = "2"
n0-error = "1"
# The stream of a connection's paths, for the line that says which path
# carried a session: the version that iroh already builds.
n0-future = "0.3"
# The congestion controllers, and their initial window, of QUIC's settings:
# iroh takes a controller's factory, and does not name one. The noq-proto
# that iroh builds, at iroh's requirement and with none of its features, so
# no crate is added and the two move together.
noq-proto = { version = "1.4.0", default-features = false }
# The check of the proxy's credentials against iroh's encoding of them, and
# the pin of a Pinggy address.
base64 = { workspace = true }
sha2 = { workspace = true }
# A node's address as iroh's own tools write it; the version of iroh's own
# crates.
iroh-tickets = "1"
# A node's record of pkarr as iroh writes and reads it, its signature
# checked: the iroh-dns that iroh builds, in iroh's range, so no crate is
# added and the two move together.
iroh-dns = { version = ">=1.4.2, <1.5", default-features = false }
# The DNS packet of a record with the `_podssh` names beside iroh's `_iroh`,
# which iroh-dns builds for one name alone: the simple-dns that iroh-dns
# builds and reads with, so no crate is added.
simple-dns = "0.13"
# The versions of iroh's relay protocol, which the question of a refused
# version offers, and, with the feature `test-relay` only, iroh's relay
# server: the iroh-relay that iroh builds, so no crate is added.
iroh-relay = { version = "1", default-features = false }
# A certificate under any name, for the feature `test-relay` only.
rcgen = { version = "0.14", optional = true }
# The TLS of the stand-in server of pkarr, for the feature `test-relay`
# only: the tokio-rustls that pod-tls builds.
tokio-rustls = { workspace = true, optional = true }

[dev-dependencies]
# The bound of a hang, scaled under an emulator.
pod-testkit = { workspace = true }
# This crate with its test relay, for its own tests.
pod-iroh = { path = ".", features = ["test-relay"] }
rustls = { workspace = true, features = ["ring"] }
sha2 = { workspace = true }
tokio = { workspace = true, features = ["macros", "rt-multi-thread", "net", "io-util", "time"] }
# pod-derp's stand-in DERP server (its feature `standin`), for the node
# that a client finds by its record alone (`tests/record_roads.rs`).
pod-derp = { workspace = true, features = ["standin"] }
