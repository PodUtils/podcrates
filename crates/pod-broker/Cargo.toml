[package]
name = "pod-broker"
description = "The egress broker of a job: a policy for each job (an allow list, or open with fixed denies), one resolve, the upstream chain, a JSON audit line for each connection, and the load and the drop of a job on a control socket."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true

[dependencies]
pod-core = { workspace = true, features = ["async"] }
# The control: the catalogue with its tiers, the server of JSON lines on a
# Unix socket, the check of the peer user (T-1000).
pod-control = { workspace = true }
# The upstream chain (a Dialer through an HTTP or SOCKS5 proxy), and the
# reader of a request's head and of a request's body.
pod-proxy = { workspace = true }
# The listeners, the copy of the bytes, the timers of a job.
tokio = { workspace = true, features = ["io-util", "net", "time", "rt", "macros", "sync"] }
# The policy (JSON and TOML), the control lines and the audit lines.
serde = { workspace = true }
serde_json = { workspace = true }
toml = { workspace = true }
# A job token is kept as its SHA-256 only, and the text of a token is wiped.
sha2 = { workspace = true }
zeroize = { workspace = true }
# The Basic credentials of Proxy-Authorization.
base64 = { workspace = true }
# The diagnostics, and the audit sink on tracing.
tracing = { workspace = true }
# The TLS end (T-100): the server of the job's side and the client to the
# far end with the provider and the trust of the host (no C), the CA of a
# job and its leaves (rcgen writes the DER with no crypto of its own; each
# signature is a P-256 key of pod-acme, pure Rust).
pod-tls = { workspace = true, features = ["async"] }
pod-acme = { workspace = true }
rcgen = { version = "0.14", default-features = false }
# The PKCS #12 trust store of a job for the JVM (T-980): the DER writer that
# rcgen takes already.
yasna = { version = "0.6", default-features = false }
rustls = { workspace = true }
rustls-pki-types = { workspace = true }

# The JSON Schemas of broker-policy.v1 and log.v1 come from the types, in
# tests only. The feature `schema` gives the JsonSchema of the policy to the
# tests of a consumer; no binary turns it on.
schemars = { workspace = true, optional = true }

[features]
schema = ["dep:schemars"]

# The umask of a test of the bind of a socket.
[target.'cfg(unix)'.dev-dependencies]
libc = "0.2"

[dev-dependencies]
pod-testkit = { workspace = true }
schemars = { workspace = true }
# A validator of JSON Schema 2020-12: each policy and each audit line gets
# the verdict of the types from the generated schemas too.
boon = { workspace = true }
tokio = { workspace = true, features = ["io-util", "net", "time", "rt", "rt-multi-thread", "macros", "sync", "test-util"] }
# The pure provider of the tests of the TLS end: a job, a far end and the
# broker in memory, with no C.
pod-tls = { workspace = true, features = ["async", "pure"] }
