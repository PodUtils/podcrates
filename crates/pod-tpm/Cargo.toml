[package]
name = "pod-tpm"
description = "A TPM 2.0 codec in pure Rust: the command frame, the response codes, the commands of a signing key under a PCR policy or a policy key, and a blocking Transport trait, each response bounded."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true

[dependencies]
# The typed failure and its class. No tokio and no C: the codec is bytes in
# and bytes out, and a transport blocks.
pod-core = { workspace = true }
# The hash of a policy digest and of a name: SHA-256, SHA-384, SHA-512.
sha2 = { workspace = true }
# The PEM text of a key file.
base64 = { workspace = true }
# A flush that failed on the drop of a guard of a handle: a diagnostic.
tracing = { workspace = true }
