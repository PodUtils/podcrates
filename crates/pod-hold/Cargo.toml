[package]
name = "pod-hold"
description = "The hold of each connect of a payload with no root: the seccomp user notification (the filter, the receive of a notification, the memory of the child, the reply and the descriptors that it adds), the table of the sockets of the payload with its flow budget, and the network namespace with its wire (a TUN, else a veth pair and a packet socket), with the feature syn-hold the hold of each SYN on the stack of pod-netstack until the dial of the consumer ends (then an accept or a RST); each hold reports its level and a proof."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true

[features]
# The memory of a child as a memfd and the recorded replies, public for the
# fuzz targets of fuzz/ and for the tests of a consumer.
fuzzing = []
# The hold of each SYN on the wire of the netns hold, on the stack of
# pod-netstack (call C90): a binary that turns it on sets
# SMOLTCP_IFACE_MAX_ADDR_COUNT = "8" in its .cargo/config.toml, as
# pod-netstack asks.
syn-hold = ["dep:pod-netstack", "tokio/sync", "tokio/macros"]

# Linux only: on another target the crate is empty.
[target.'cfg(target_os = "linux")'.dependencies]
pod-core = { workspace = true }
# The raw system calls that pod-hostprobe has: prctl, seccomp, unshare,
# prlimit64.
pod-hostprobe = { workspace = true }
libc = "0.2"
# The receive of a notification waits on the reactor.
tokio = { workspace = true, features = ["net", "rt"] }
# The stack of the hold of a SYN (the feature `syn-hold`).
pod-netstack = { workspace = true, optional = true }

[target.'cfg(target_os = "linux")'.dev-dependencies]
tokio = { workspace = true, features = ["net", "rt", "macros", "time", "io-util", "sync"] }
# The stack that answers on the veth wire of tests/veth.rs, as podnet's
# stack answers on it.
pod-netstack = { workspace = true }

# The holds of a real payload: a test binary with no libtest, so that the
# children fork from a process with one thread, and the binary is the
# payload itself (its first argument names the part of the payload).
[[test]]
name = "hold"
harness = false

# The veth wire with a stack on it: no libtest, so that the child forks from
# a process with one thread.
[[test]]
name = "veth"
harness = false
