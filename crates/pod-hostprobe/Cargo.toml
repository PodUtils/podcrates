[package]
name = "pod-hostprobe"
description = "The probes of a Linux host: one disposable child for each probe, the errno and never a boolean, \"could not run\" as a third state, and the raw system calls."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true

# Linux only: on another target the crate is empty.
[target.'cfg(target_os = "linux")'.dependencies]
pod-core = { workspace = true }
# `struct open_how` and the calls of an open under a base (`sys::Beneath`).
pod-beneath = { workspace = true }
# The layouts of the structs of the kernel, the errno numbers, the open
# flags and, on the architectures that syscalls does not build for, the
# numbers of the calls.
linux-raw-sys = { workspace = true, features = ["errno"] }
# The JSON object of the module `report`, behind the feature `report`.
serde = { workspace = true, optional = true }
serde_json = { workspace = true, optional = true }
# The JSON Schema of the report, behind the feature `schema`.
schemars = { workspace = true, optional = true }

[features]
# The module `report`: the JSON object of `Findings` and `Selection`, and
# its reader. Off by default: a probe that writes no report links no serde.
report = ["dep:serde", "dep:serde_json"]
# `report::schema`: the JSON Schema of the report, generated from its
# types (`schemas/hostprobe-report.v1.schema.json`). For the tests of a
# consumer that validate a report; no binary turns it on.
schema = ["report", "dep:schemars"]

# syscalls has the crate attribute `#![feature(asm_experimental_arch)]` on
# mips, mips64, s390x, powerpc and powerpc64, so it does not build there on
# stable Rust. A `cfg` in the code cannot stop cargo from building a crate
# of the graph, so the dependency is gated here. The list is the list of
# syscalls 0.8.1 (src/lib.rs). On these five, src/sys takes the numbers
# from linux-raw-sys and has its own trap.
[target.'cfg(all(target_os = "linux", not(any(target_arch = "mips", target_arch = "mips64", target_arch = "s390x", target_arch = "powerpc", target_arch = "powerpc64"))))'.dependencies]
syscalls = { workspace = true }

[dev-dependencies]
# A path only: pod-testkit depends on this crate, and cargo publish drops a
# dev-dependency with no version (scripts/check-publish-order.py).
pod-testkit = { path = "../pod-testkit", features = ["schema"] }
# The tests of the schema: the derive of each wire type, and a validator
# of JSON Schema 2020-12 for the examples of tests/examples/.
schemars = { workspace = true }
boon = { workspace = true }

# The probe children of the whole set: a test binary with no libtest, so
# that it reads the flag of a child before anything else.
[[test]]
name = "children"
harness = false

# The leg through a user namespace as a caller with no capabilities: a
# probe child of this binary, so no libtest.
[[test]]
name = "userns_leg"
harness = false

# The rows of the classes of podssh and podnet as this user, and as root
# again as uid 65534: probe children of this binary, so no libtest.
[[test]]
name = "host_rows"
harness = false
