[package]
name = "pod-hostprobe"
description = "The probes of a Linux host: one disposable child for each probe, the errno and never a boolean, \"could not run\" as a third state, and the raw system calls."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true

# Linux only: on another target the crate is empty.
[target.'cfg(target_os = "linux")'.dependencies]
pod-core = { workspace = true }
# The layouts of the structs of the kernel and, on the architectures that
# syscalls does not build for, the numbers of the calls.
linux-raw-sys = { workspace = true }

# syscalls has the crate attribute `#![feature(asm_experimental_arch)]` on
# mips, mips64, s390x, powerpc and powerpc64, so it does not build there on
# stable Rust. A `cfg` in the code cannot stop cargo from building a crate
# of the graph, so the dependency is gated here. The list is the list of
# syscalls 0.8.1 (src/lib.rs). On these five, src/sys takes the numbers
# from linux-raw-sys and has its own trap.
[target.'cfg(all(target_os = "linux", not(any(target_arch = "mips", target_arch = "mips64", target_arch = "s390x", target_arch = "powerpc", target_arch = "powerpc64"))))'.dependencies]
syscalls = { workspace = true }

[dev-dependencies]
pod-testkit = { workspace = true }

# The probe children of the whole set: a test binary with no libtest, so
# that it reads the flag of a child before anything else.
[[test]]
name = "children"
harness = false
