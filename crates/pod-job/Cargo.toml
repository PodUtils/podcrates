[package]
name = "pod-job"
description = "The records of a CI runner's job: the job offer, the unit capability, the run report and the public report, with their ids, the refusal codes and the checks that serde does not do."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true

[dependencies]
serde = { workspace = true }
# The policy of an offer is a JSON object that the crate does not read.
serde_json = { workspace = true }

# The JSON Schemas of schemas/ come from the types, in tests only (ruling
# Q-A8). The feature `schema` gives the JsonSchema of each type to the tests
# of a consumer; no binary turns it on.
schemars = { workspace = true, optional = true }

[features]
schema = ["dep:schemars"]

[dev-dependencies]
schemars = { workspace = true }
# A validator of JSON Schema 2020-12 on Rust's regex: each example goes
# through the generated schemas too. It refuses a pattern with a
# look-around, which other languages' validators do not take either.
boon = { workspace = true }
