[package]
name = "pod-unit"
description = "Hardened service units with no secret in them: user and system units of systemd with their hardening and credentials, LaunchAgents and LaunchDaemons of launchd, tasks and services of Windows, and lines of the crontab; the check of a secret in a unit, and the install and the removal of a unit of the user and of the system."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true

[dependencies]
# The typed failure, the private write of a file and the bounded run of a
# program.
pod-core = { workspace = true }
# The blob of an OpenSSH public key, which the check of a secret passes.
base64 = { workspace = true }

[target.'cfg(windows)'.dependencies]
# The check that this process may create a service (OpenSCManagerW), and
# the dispatcher of the service control manager (T-1026).
windows-sys = { version = "0.61", features = ["Win32_Foundation", "Win32_System_Services"] }

[dev-dependencies]
# The check of a program of the host for a test that skips without it.
pod-testkit = { workspace = true }
tempfile = "3"
# The plist reads back as a property list.
plist = "1.10"
# The XML of a task reads back.
quick-xml = "0.42"

# A Windows service of the test program (T-1026): no libtest, as the service
# control manager runs the binary again as the service, and the dispatcher
# takes the thread of main.
[[test]]
name = "service_live"
harness = false
