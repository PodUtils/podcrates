# The static QEMU 11.0.0 of hermeticbuild/qemu-prebuilt (MIT): the build
# 11.0.0.1 of the upstream tag v11.0.0 in an Alpine container, with
# `configure --static` and no patch of QEMU. It holds the fix "system/physmem:
# fix use-after-free with dispatch" (QEMU commit 2865bf1c; 10.1.0, stable
# 10.0.4): a SIGSEGV in address_space_translate_for_iotlb at the boot of a
# guest with four vCPUs under TCG (PodUtils/podvm#618). podvm's store fetches
# the archives of qemu-system-x86_64, qemu-system-aarch64 (an arm64 guest)
# and qemu-img, and the data archive (share/qemu: SeaBIOS, the option ROMs,
# edk2), and checks the size and the sha256 of each before it uses a byte.
# Each archive keeps the installed layout (./bin/NAME, ./share/qemu/...).
# The release attests each archive (SLSA provenance of its release
# workflow, the asset qemu-linux-amd64-11.0.0.1.attestation.jsonl).
# scripts/ci/static-qemu.sh reads this file.
id = "hermeticbuild-qemu"
kind = "tool"
party = "hermeticbuild"
about = "The static builds of QEMU 11.0.0 for an x86_64 Linux host in the releases of hermeticbuild/qemu-prebuilt"

[[endpoint]]
name = "qemu-system-x86-64"
scheme = "https"
host = "github.com"
port = 443
path = "/hermeticbuild/qemu-prebuilt/releases/download/11.0.0.1/qemu-system-bin-linux-amd64-x86_64-softmmu-11.0.0.1.tar.gz"
source = { url = "https://github.com/hermeticbuild/qemu-prebuilt/releases/tag/11.0.0.1", read = 2026-11-20, note = "the emulator of an x86_64 guest (PodUtils/podvm#618)" }

[[endpoint]]
name = "qemu-system-aarch64"
scheme = "https"
host = "github.com"
port = 443
path = "/hermeticbuild/qemu-prebuilt/releases/download/11.0.0.1/qemu-system-bin-linux-amd64-aarch64-softmmu-11.0.0.1.tar.gz"
source = { url = "https://github.com/hermeticbuild/qemu-prebuilt/releases/tag/11.0.0.1", read = 2026-11-20, note = "the emulator of an arm64 guest on an x86_64 host (PodUtils/podvm#394)" }

[[endpoint]]
name = "qemu-img"
scheme = "https"
host = "github.com"
port = 443
path = "/hermeticbuild/qemu-prebuilt/releases/download/11.0.0.1/qemu-img-linux-amd64-11.0.0.1.tar.gz"
source = { url = "https://github.com/hermeticbuild/qemu-prebuilt/releases/tag/11.0.0.1", read = 2026-11-20, note = "the tool of the overlays (PodUtils/podvm#389)" }

[[endpoint]]
name = "data"
scheme = "https"
host = "github.com"
port = 443
path = "/hermeticbuild/qemu-prebuilt/releases/download/11.0.0.1/qemu-system-data-linux-amd64-11.0.0.1.tar.gz"
source = { url = "https://github.com/hermeticbuild/qemu-prebuilt/releases/tag/11.0.0.1", read = 2026-11-20, note = "share/qemu of the build: the firmware and the option ROMs" }

