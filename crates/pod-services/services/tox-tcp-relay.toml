# The public TCP relays of Tox (PodUtils/podssh@T-734): each node of the
# list of the Tox project whose tcp_ports holds 443 and whose status_tcp is
# true, as its IPv4 literal on port 443. The fact public-key-NAME of each
# endpoint is the node's public key, as the list gives it: the handshake of
# the TCP relay boxes to that key. The name of an endpoint is node- and the
# first eight digits of its key. The endpoints come in the order of their
# keys, not in the order of the list (C83): podssh picks a relay by the
# SHA-256 of the name of a pair over this order, and the order of the list
# moves at each scan. Volunteers run the nodes, with no account. A relay
# sees the keys of the two ends, the times and the sizes.
id = "tox-tcp-relay"
kind = "tcp-relay"
party = "the Tox project (public nodes run by volunteers)"
about = "The TCP relays of the public bootstrap nodes of Tox on port 443, each with the public key of its node"

[[endpoint]]
name = "node-197f7466"
scheme = "tcp"
host = "119.59.101.63"
port = 443
source = { url = "https://nodes.tox.chat/json", read = 2026-11-12, note = "the node of the public key 197F7466: ipv4, 443 in tcp_ports, status_tcp true, location TH" }

