# Each endpoint is the item of /nodes whose public_key is its fact, with
# its host as ipv4 (or ipv6), 443 in tcp_ports and status_tcp true. A node
# with 443 and status_tcp true that the file does not have is counted.
[[watch]]
kind = "http-json"
url = "https://nodes.tox.chat/json"
pointer = "/nodes"
key = "public_key"
fact-prefix = "public-key-"
member = ["ipv4", "ipv6"]
port-member = "tcp_ports"
true-members = ["status_tcp"]
