# Each endpoint is the relay of the pool whose device ID is its fact, with
# its host and port 443 in its URL. A relay on 443 that the file does not
# have is counted: the pool holds each relay, the file the ones up 7 days.
[[watch]]
kind = "http-json"
url = "https://relays.syncthing.net/endpoint/full"
pointer = "/relays"
url-member = "url"
key = "id"
fact-prefix = "device-id-"
member = "host"
port-member = "port"
