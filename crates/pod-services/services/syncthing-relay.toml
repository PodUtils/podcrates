# The public relays of Syncthing on port 443 (PodUtils/podssh@T-571,
# PodUtils/podssh#209): each relay of the pool of the Syncthing project
# whose URL has port 443 and an IP literal, and that was up 7 days or more
# when the pool was read (call C104). The fact device-id-NAME of each
# endpoint is the relay's device ID, from the id of its URL: the TLS of the
# relay protocol shows the certificate of that device. The name of an
# endpoint is relay- and the first seven characters of its device ID. The
# endpoints come in the order of their device IDs (as C83 orders the Tox
# relays): a consumer that picks a relay by a hash over this order picks
# the same one at both ends. Volunteers run the relays, with no account. A
# relay sees the device IDs of the two ends, the times and the sizes; the
# two ends encrypt their data end to end. The pool gives 100 relays at
# random at /endpoint; /endpoint/full gives each relay, with its stats.
id = "syncthing-relay"
kind = "syncthing-relay"
party = "the Syncthing project (public relays run by volunteers)"
about = "The public relays of Syncthing on port 443 that were up 7 days or more, each with its device ID"

