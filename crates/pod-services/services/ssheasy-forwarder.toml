# The proxy of ssheasy's SSH client in a browser: a public WebSocket
# forwarder that takes the target in a first frame of JSON.
id = "ssheasy-forwarder"
kind = "forwarder"
party = "ssheasy (hullarb)"
about = "The WebSocket proxy of ssheasy's SSH client in a browser"

[rank]
value = 2
source = { ruling = "PodUtils/podssh, the operator ruling Q56: the three forwarders that GitHub #59 measured, a second provider before a second copy of the first (crates/podssh-ws/src/forwarder/builtin.rs)", read = 2026-10-31 }

[[endpoint]]
name = "forwarder"
scheme = "wss"
host = "ssheasy.com"
port = 443
path = "/p"
source = { measured = "a tester forwarded to github.com:22 through it and got the banner of GitHub, from a host with direct egress (PodUtils/podssh GitHub #59)", read = 2026-10-31 }

[[fact]]
name = "word"
value = "ssheasy"
source = { ruling = "PodUtils/podssh, the operator ruling Q56: the three forwarders that GitHub #59 measured, a second provider before a second copy of the first (crates/podssh-ws/src/forwarder/builtin.rs)", read = 2026-10-31 }

[[fact]]
name = "template"
value = "wss://ssheasy.com/p"
source = { measured = "a tester forwarded to github.com:22 through it and got the banner of GitHub, from a host with direct egress (PodUtils/podssh GitHub #59)", read = 2026-10-31 }

[[fact]]
name = "note"
value = "the proxy of ssheasy's SSH client in a browser, which takes the target in a first frame; its code slows a connection to 100 KiB/s after 1 GiB, and takes one connection a second from each address"
source = { url = "https://raw.githubusercontent.com/hullarb/ssheasy/HEAD/proxy/main.go", read = 2026-11-02, note = "its last change 94592d8497 (PodUtils/podssh docs/carriers.md, N6)" }

[[watch]]
kind = "websocket-upgrade"
endpoint = "forwarder"

[[watch]]
kind = "forward-banner"
template = "template"
target = "github-ssh"
