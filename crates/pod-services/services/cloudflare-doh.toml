# Cloudflare's DNS over HTTPS by IP address (a resolver needs no
# resolver), with the name that its certificate holds: asked by the name
# through a proxy, by the address with no proxy.
id = "cloudflare-doh"
kind = "doh"
party = "Cloudflare"
about = "1.1.1.1: DNS over HTTPS in RFC 8484's wire form and in Cloudflare's JSON form"

[rank]
value = 1
source = { ruling = "the order of both consumers: PodUtils/podssh crates/podssh-ws/src/resolve.rs (DOH_RESOLVERS) and PodUtils/podnet src/resolve.rs (DOH_SERVERS)", read = 2026-11-05 }

[[endpoint]]
name = "v4-1"
role = "v4"
scheme = "https"
host = "cloudflare-dns.com"
port = 443
addresses = ["1.1.1.1"]
source = { measured = "the TLS certificate at this address on port 443 names the host and the address (openssl s_client through the HTTPS proxy of the session)", read = 2026-11-06, note = "https://developers.cloudflare.com/1.1.1.1/ip-addresses/ lists the address; podssh read the name on 2026-11-01" }

[[endpoint]]
name = "v4-2"
role = "v4"
scheme = "https"
host = "cloudflare-dns.com"
port = 443
addresses = ["1.0.0.1"]
source = { measured = "the TLS certificate at this address on port 443 names the host and the address (openssl s_client through the HTTPS proxy of the session)", read = 2026-11-06, note = "https://developers.cloudflare.com/1.1.1.1/ip-addresses/ lists the address" }

[[endpoint]]
name = "v6-1"
role = "v6"
scheme = "https"
host = "cloudflare-dns.com"
port = 443
addresses = ["2606:4700:4700::1111"]
source = { measured = "the TLS certificate of 1.1.1.1:443 names the host and this address (openssl s_client through the HTTPS proxy of the session)", read = 2026-11-06, note = "https://developers.cloudflare.com/1.1.1.1/ip-addresses/ lists the address" }

[[endpoint]]
name = "v6-2"
role = "v6"
scheme = "https"
host = "cloudflare-dns.com"
port = 443
addresses = ["2606:4700:4700::1001"]
source = { measured = "the TLS certificate of 1.1.1.1:443 names the host and this address (openssl s_client through the HTTPS proxy of the session)", read = 2026-11-06, note = "https://developers.cloudflare.com/1.1.1.1/ip-addresses/ lists the address" }

[[fact]]
name = "json-path"
value = "/dns-query"
source = { url = "https://developers.cloudflare.com/1.1.1.1/encryption/dns-over-https/make-api-requests/", read = 2026-11-06, note = "with accept: application/dns-json" }

[[fact]]
name = "wire-path"
value = "/dns-query"
source = { url = "https://developers.cloudflare.com/1.1.1.1/encryption/dns-over-https/make-api-requests/", read = 2026-11-06 }

[[fact]]
name = "http2-only"
value = false
source = { measured = "a query over HTTP/1.1 got an answer (PodUtils/podssh crates/podssh-ws/src/resolve.rs, T-405)", read = 2026-10-31 }

[[watch]]
kind = "tls-names"
role = "v4"

[[watch]]
kind = "doh-answer"
form = "wire"
name = "example.com"
type = "A"
