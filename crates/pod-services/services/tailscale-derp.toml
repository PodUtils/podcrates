# Tailscale's main DERP fleet, from its default map: podssh's DERP road
# tries it after tailcat's servers (the owner's ruling Q74 of podssh). The
# role of each server is the code of its region; the servers come in the
# order of the regions' ids, the first of each region first.
id = "tailscale-derp"
kind = "derp"
party = "Tailscale"
about = "The DERP servers of Tailscale's default map, one group for each region"

[rank]
value = 1
source = { ruling = "PodUtils/podssh#159: after tailcat-derp (podssh's ruling Q74)", read = 2026-11-06 }

