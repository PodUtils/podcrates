# The static QEMU 11.1.3 of PodUtils/static-pkgs (GPL-2.0-only; the recipe
# pkgs/qemu comes from hermeticbuild/qemu-prebuilt, MIT): the release
# qemu-11.1.3 builds the upstream tag v11.1.3 (commit 005c61c0) in an Alpine
# container with `configure --static` and no patch of QEMU, and it carries
# the source of each copyleft part as an asset. It holds the migration of an
# NVMe device (QEMU commit 9d378cab; 11.1.0), which the warm save of the
# plan line of pod-guest with its NVMe root disk needs (T-1035), and the fix
# "system/physmem: fix use-after-free with dispatch" (QEMU commit 2865bf1c;
# 10.1.0): a SIGSEGV in address_space_translate_for_iotlb at the boot of a
# guest with four vCPUs under TCG (PodUtils/podvm#618).
#
# podvm's store fetches the archives of qemu-system-x86_64,
# qemu-system-aarch64 (an arm64 guest) and qemu-img, and the data archive
# (share/qemu: SeaBIOS, the option ROMs, edk2), and checks the size and the
# sha256 of each before it uses a byte. Each archive keeps the installed
# layout (./bin/NAME, ./share/qemu/...). The pins are the archives for an
# x86_64 (amd64) host. The release attests each asset (SLSA provenance of
# its release workflow on main, the asset qemu-11.1.3.attestation.jsonl).
# scripts/ci/static-qemu.sh reads this file.
id = "static-pkgs-qemu"
kind = "tool"
party = "PodUtils"
about = "The static builds of QEMU 11.1.3 for an x86_64 Linux host in the release qemu-11.1.3 of PodUtils/static-pkgs"

[[endpoint]]
name = "qemu-system-x86-64"
scheme = "https"
host = "github.com"
port = 443
path = "/PodUtils/static-pkgs/releases/download/qemu-11.1.3/qemu-system-x86_64-11.1.3-linux-amd64.tar.gz"
source = { url = "https://github.com/PodUtils/static-pkgs/releases/tag/qemu-11.1.3", read = 2026-11-20, note = "the emulator of an x86_64 guest (PodUtils/podvm#618)" }

