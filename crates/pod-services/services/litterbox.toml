# Litterbox: the temporary uploads of Catbox, with no account. An upload
# is a multipart POST of the fields time, fileNameLength and reqtype and
# one file to the endpoint upload, as the host's own upload form sends
# them; the answer is the URL of the file as text, served from
# litter.catbox.moe. The second of the four file hosts of
# PodUtils/podssh@T-738 (PodUtils/podssh#220). The documents api and front
# are the pages that the watches read. serves and fetch-method are
# podssh's reading of 2026-11-12; the rest was read on 2026-11-13.
#
# The upload answers 412 "Invalid uploader" to a GitHub runner with the
# fields of the API page (PodUtils/podssh#230) and with those of the upload
# form (live.yml run 43448958418, T-529). Catbox refuses an anonymous
# upload from the networks of clouds; a userhash of an account passes, but
# it makes the owner of the account answerable for each upload. So
# on-by-default is false: a road takes the host only when its user names it
# (call C285). The terms refuse no upload by a program, so the host keeps
# its rank.
id = "litterbox"
kind = "file-host"
party = "Catbox LLC"
about = "Litterbox, the temporary uploads of Catbox: a multipart POST of one file, the URL as text, a life of 1 h to 72 h"

[rank]
value = 2
source = { ruling = "podssh's order of the file hosts (PodUtils/podssh#220, PodUtils/podssh@T-738)", read = 2026-11-12 }

[[endpoint]]
name = "upload"
scheme = "https"
host = "litterbox.catbox.moe"
port = 443
path = "/resources/internals/api.php"
source = { url = "https://litterbox.catbox.moe/tools.php", read = 2026-11-13, note = "The API is located at https://litterbox.catbox.moe/resources/internals/api.php; a GET answers 412 No request type given." }

[[endpoint]]
name = "api"
role = "document"
scheme = "https"
host = "litterbox.catbox.moe"
port = 443
path = "/tools.php"
source = { url = "https://litterbox.catbox.moe/tools.php", read = 2026-11-13 }

[[endpoint]]
name = "front"
role = "document"
scheme = "https"
host = "litterbox.catbox.moe"
port = 443
path = "/"
source = { url = "https://litterbox.catbox.moe/", read = 2026-11-13 }

[[fact]]
name = "file-field"
value = "fileToUpload"
source = { url = "https://litterbox.catbox.moe/tools.php", read = 2026-11-13, note = "reqtype=\"fileupload\" time=\"1h/12h/24h/72h\" fileToUpload=(file data here)" }

# The shortest life: time is 1h, 12h, 24h or 72h. fileNameLength (6 or 16)
# is the length of the name of the file in its URL; the API page does not
# name it, the upload form of the front page sends it (call C281).
[[fact]]
name = "fields"
value = ["time=1h", "fileNameLength=16", "reqtype=fileupload"]
source = { url = "https://litterbox.catbox.moe/", read = 2026-11-13, note = "the upload form: <input type=\"hidden\" name=\"time\" value=\"1h\"> <input type=\"hidden\" name=\"fileNameLength\" value=\"16\"> <input type=\"hidden\" name=\"reqtype\" value=\"fileupload\">; tools.php: Allowed values for \"time\" are 1h, 12h, 24h, and 72h." }

[[fact]]
name = "life-seconds"
value = 3600
unit = "s"
source = { url = "https://litterbox.catbox.moe/tools.php", read = 2026-11-13, note = "the life that the field time=1h gives" }

[[fact]]
name = "answer"
value = "text"
source = { url = "https://litterbox.catbox.moe/resources/litterbox.catbox.moe.sxcu", read = 2026-11-13, note = "the ShareX setting of the API: \"ResponseType\": \"Text\"; the upload form shows the text of the answer as the URL" }

[[fact]]
name = "serves"
value = ["litter.catbox.moe"]
source = { url = "https://github.com/PodUtils/podssh/issues/220", read = 2026-11-12, note = "podssh's reading; https://litter.catbox.moe/ answered 403 to a GET of its root on 2026-11-13" }

[[fact]]
name = "fetch-segment"
value = ""
source = { url = "https://github.com/PodUtils/podssh/issues/220", read = 2026-11-12, note = "podssh's reading: a GET of the URL of the answer gives the file" }

[[fact]]
name = "fetch-method"
value = "GET"
source = { url = "https://github.com/PodUtils/podssh/issues/220", read = 2026-11-12, note = "podssh's reading; not read here" }

[[fact]]
name = "delete"
value = "none"
source = { url = "https://litterbox.catbox.moe/tools.php", read = 2026-11-13, note = "There is only 1 request type for Litterbox - fileupload." }

# 1 GB: the lower of 10^9 and 2^30 bytes.
[[fact]]
name = "upload-bytes-most"
value = 1000000000
unit = "bytes"
source = { url = "https://litterbox.catbox.moe/", read = 2026-11-13, note = "Temporary uploads up to 1 GB are allowed." }

[[fact]]
name = "one-person"
value = false
source = { url = "https://catbox.moe/legal.php", read = 2026-11-13, note = "Thank you for choosing Catbox (officially as Catbox LLC)" }

[[fact]]
name = "automated-uploads-refused"
value = false
source = { url = "https://catbox.moe/legal.php", read = 2026-11-13, note = "the terms refuse commercial use without prior approval and damaging items (bots among them), not uploads by a program" }

[[fact]]
name = "on-by-default"
value = false
source = { url = "https://github.com/PodUtils/podcrates/actions/runs/43448958418", read = 2026-11-13, note = "the live round trip from a GitHub runner: the upload answered HTTP 412 Invalid uploader; oleksii-latyshev/disalytics#488 (2026-10-03): Catbox rejects anonymous uploads from Cloudflare egress (412 Invalid uploader); yosheloa-stack/Botnovo#19 (2026-10-26) saw the same 412" }

[[fact]]
name = "note"
value = "The terms of Catbox refuse commercial use without prior approval; the FAQ refuses .exe, .scr, .cpl, .doc* and .jar files, and Catbox keeps the IP address with each upload. An anonymous upload from the network of a cloud (a GitHub runner, Cloudflare) gets 412 Invalid uploader, so the host is not on by default; a user who reaches it from another network names it."
source = { url = "https://litterbox.catbox.moe/faq.php", read = 2026-11-13 }

[[watch]]
kind = "http-text"
endpoint = "api"
contains = "The API is located at https://litterbox.catbox.moe/resources/internals/api.php"

[[watch]]
kind = "http-text"
endpoint = "api"
contains = "Allowed values for \"time\" are 1h, 12h, 24h, and 72h."

[[watch]]
kind = "http-text"
endpoint = "front"
contains = "Temporary uploads up to 1 GB are allowed."

[[watch]]
kind = "http-text"
endpoint = "front"
contains = "<input type=\"hidden\" name=\"fileNameLength\" value=\"16\">"

[[watch]]
kind = "http-status"
endpoint = "upload"
status = 412
