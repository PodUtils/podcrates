# Pinggy's free SSH relay: the default relay of podnet's transport ssh (a
# remote forward through an SSH server on port 443).
id = "pinggy"
kind = "ssh-tunnel"
party = "Pinggy"
about = "The free tier of Pinggy's SSH tunnels, with an anonymous login"

[[endpoint]]
name = "ssh"
scheme = "ssh"
host = "free.pinggy.io"
port = 443
source = { url = "https://pinggy.io/docs/", read = 2026-11-06, note = "ssh -p 443 -R0:localhost:8000 free.pinggy.io" }

# SSH inside TLS, for a host whose proxy passes TLS alone.
[[endpoint]]
name = "ssh-tls"
scheme = "ssh+tls"
host = "free.pinggy.io"
port = 443
sni = "free.pinggy.io"
source = { url = "https://pinggy.io/docs/client_behind_proxy/", read = 2026-11-09, note = 'ssh -p443 -R0:localhost:4000 -o ProxyCommand="openssl s_client -quiet -connect %h:%p" free.pinggy.io' }

[[endpoint]]
name = "ssh-tls-alt"
scheme = "ssh+tls"
host = "free.pinggy.io"
port = 7878
sni = "free.pinggy.io"
source = { url = "https://pinggy.io/docs/client_behind_proxy/", read = 2026-11-09, note = 'ssh -p7878 -R0:localhost:4000 -o ProxyCommand="ncat --ssl %h %p" free.pinggy.io' }

# The facts of a forward relay (README, "SSH forward relays"). The user
# names the type of the tunnel (http) and no account.
[[fact]]
name = "user"
value = "http"
source = { url = "https://pinggy.io/docs/usages/", read = 2026-11-11, note = "we use the username to send the tunnel token and other keywords to the server ... These keywords set the tunnel type. The default tunnel is the http type." }

# The banner names an HTTP and an HTTPS URL of the tunnel: take the HTTPS one.
[[fact]]
name = "url-match"
value = ["https://", ".run.pinggy-free.link"]
source = { url = "https://pinggy.io/docs/", read = 2026-11-11, note = "You can access local server via following URL(s): http://uljtt-30-47-152-61.run.pinggy-free.link https://uljtt-30-47-152-61.run.pinggy-free.link" }

# The banner names the dashboard before the tunnel's URLs.
[[fact]]
name = "url-skip"
value = ["dashboard.pinggy.io"]
source = { measured = "the banner of free.pinggy.io that podnet read: Upgrade to Pinggy Pro to get unrestricted tunnels. https://dashboard.pinggy.io, then the tunnel's URLs (PodUtils/podnet crates/podnet-serve/src/relay/tests.rs, picks_the_tunnel_url_and_not_the_dashboard)", read = 2026-10-09, note = "https://pinggy.io/docs/ names the host: With Pinggy Pro you can customize these urls by logging in to dashboard.pinggy.io" }

# The keepalive of the command that the site makes for a free tunnel.
[[fact]]
name = "keepalive-seconds"
value = 30
unit = "s"
source = { url = "https://pinggy.io/", read = 2026-11-11, note = "Configure your free tunnel, Keep Alive: the script of the page adds -o ServerAliveInterval=30 (the guide of long running tunnels uses 60, with a token)" }

[[watch]]
kind = "ssh-banner"
endpoint = "ssh"

[[fact]]
name = "host-key-sha256"
value = "SHA256:nFd5rfJMGuZXvfeRzJ/BtT3TfksAxTWMajcrHRcI7AM"
source = { url = "https://pinggy.io/", read = 2026-11-09, note = "All Pinggy edge servers use the same RSA host key: ssh-rsa SHA256:nFd5rfJMGuZXvfeRzJ/BtT3TfksAxTWMajcrHRcI7AM" }

[[fact]]
name = "tunnel-zone"
value = "a.pinggy.link"
source = { url = "https://pinggy.io/docs/tls_tunnels/", read = 2026-11-09, note = "Pinggy edge (*.a.pinggy.link): routes by SNI, never decrypts" }

[[fact]]
name = "free-tunnel-minutes"
value = 60
unit = "min"
source = { url = "https://pinggy.io/", read = 2026-11-09, note = "60 minutes tunnel timeout" }

[[watch]]
kind = "ssh-host-key"
endpoint = "ssh"
fact = "host-key-sha256"
