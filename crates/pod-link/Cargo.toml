[package]
name = "pod-link"
description = "A link between two peers: many streams over one carrier byte stream, with a credit window for each stream and for the link, a keepalive, and the carriers (a unix socket, a memory pair) behind one trait."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true

[features]
# The tcp carrier: TLS 1.3 over a dial of the caller's way out, each side
# pinning the Ed25519 key of the other (`tcp`). Without it, no TLS crate is
# in the build.
tcp = ["dep:pod-tls", "dep:rustls", "dep:tokio-rustls", "pod-core/async"]
# The ws carrier: a WebSocket over the TLS of `tcp`, its listener on the
# accept loop of pod-ws (`ws`).
ws = ["tcp", "dep:pod-ws", "pod-ws/serve"]
# The h2 carrier: one POST of HTTP/2 over the TLS of `tcp` (`h2`).
h2 = ["tcp", "dep:h2", "dep:http", "dep:bytes", "dep:pod-ws"]
# The quic carrier: one bidirectional stream of a QUIC connection of
# pod-quic, with the TLS and the pins of `tcp` (`quic`).
quic = ["tcp", "dep:pod-quic"]
# The udp carrier: KCP over UDP or the caller's datagrams, with the TLS and
# the pins of `tcp` above it (`udp`).
udp = ["tcp", "dep:kcp"]
# The carriers over requests of HTTP/1.1 with the TLS of `tcp`: the long
# poll, SSE, a chunked stream and the simplex poll (`poll`).
poll = ["tcp", "dep:pod-ws", "dep:base64"]

[dependencies]
# The failure and its stage and class; the way out of the tcp carrier.
pod-core = { workspace = true }
# The Ed25519 key that a carrier proves for its peer (`Accepted`).
pod-identity = { workspace = true }
# The TLS of the tcp carrier, with the provider of the caller.
pod-tls = { workspace = true, optional = true }
rustls = { workspace = true, optional = true }
tokio-rustls = { workspace = true, optional = true }
# The WebSocket of the ws carrier: the upgrade, the session, the bridge of
# its messages and the accept loop.
pod-ws = { workspace = true, optional = true }
# HTTP/2 of the h2 carrier, pure Rust; its stream as a byte stream is
# pod-ws's (`h2_road::duplex`).
h2 = { workspace = true, optional = true }
http = { workspace = true, optional = true }
bytes = { workspace = true, optional = true }
# QUIC of the quic carrier: noq with the TLS provider of the caller, over a
# system socket or the datagrams of the caller's way out.
pod-quic = { workspace = true, optional = true }
# KCP of the udp carrier: the ARQ of ikcp in pure Rust, with its wire and
# its congestion window (call C271). No feature: no tokio of its own.
kcp = { workspace = true, optional = true }
# The data of the events of SSE (the poll carriers).
base64 = { workspace = true, optional = true }
# The driver of a link, the streams, the carriers and the keepalive's clock.
tokio = { workspace = true, features = ["io-util", "net", "time", "sync", "rt", "macros"] }
tracing = { workspace = true }

# The uid of this process (the peer check of the unix carrier) and the move
# of a bound socket with no replace. libc compiles no C.
[target.'cfg(unix)'.dependencies]
libc = "0.2"

[dev-dependencies]
# The way out through a proxy of the test of the h2 carrier, and a client
# of HTTP/2 of another form.
pod-proxy = { workspace = true }
h2 = { workspace = true }
http = { workspace = true }
bytes = { workspace = true }
# The tests of the tcp carrier: the loopback guard, ring as the provider,
# a peer of TLS 1.2 and a client of another form.
pod-testkit = { workspace = true }
pod-tls = { workspace = true }
rustls = { workspace = true, features = ["ring"] }
tokio-rustls = { workspace = true }
# A link over a resumable session (T-311).
pod-session = { workspace = true }
sha2 = { workspace = true }
# `test-util` gives the keepalive's tests a paused clock.
tokio = { workspace = true, features = ["io-util", "net", "time", "sync", "rt", "rt-multi-thread", "macros", "test-util"] }
