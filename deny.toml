# cargo-deny: the advisories, licenses, duplicate versions and sources of
# the dependencies. CI runs it (.github/workflows/deny.yml). By hand:
#
#   cargo deny --all-features --locked check advisories licenses bans sources

[graph]
all-features = true
# The release targets of the consumers (docs/design.md, Targets). A crate
# that only another target compiles is in no release, and is not checked.
targets = [
  "x86_64-unknown-linux-musl",
  "aarch64-unknown-linux-musl",
  "armv7-unknown-linux-musleabihf",
  "riscv64gc-unknown-linux-musl",
  "i686-unknown-linux-musl",
  "arm-unknown-linux-musleabihf",
  "loongarch64-unknown-linux-musl",
  "powerpc64le-unknown-linux-musl",
  "x86_64-unknown-linux-gnu",
  "aarch64-unknown-linux-gnu",
  "x86_64-apple-darwin",
  "aarch64-apple-darwin",
  "x86_64-pc-windows-msvc",
  "aarch64-pc-windows-msvc",
]

[advisories]
version = 2
yanked = "deny"
# Each ignored advisory has its reason and the date it was read.
ignore = [
  # rsa 0.9, feature rsa of pod-tls (read 2026-11-05): a timing attack on
  # the operations with a private key. pod-tls verifies signatures with
  # public keys only (docs/design.md, section 2). rsa 0.10.0-rc, under
  # russh of pod-services-watch (call C88), is a pre-release of the patched
  # 0.10.0: the watch verifies the RSA host key of a relay with its public
  # key, and its own key is Ed25519.
  { id = "RUSTSEC-2023-0071", reason = "pod-tls and the russh client of pod-services-watch verify with RSA public keys only; the advisory concerns private-key operations" },
  # SQLite before 3.54.0 can give stale memory of its page cache when it
  # opens a database with a crafted `-wal` file of another page size. Only
  # pod-tor links it, through arti's tor-dirmgr, and each arti release up to
  # 0.48 (tor-dirmgr `rusqlite >=0.36, <0.41`) refuses the rusqlite 0.41 that
  # brings the fixed libsqlite3-sys 0.39. Arti opens only the database of
  # the caller's cache directory, which its check of permissions
  # (fs-mistrust) refuses when another user can write it. Take the fix when
  # arti takes rusqlite 0.41 (call C766). Read 2026-11-16.
  { id = "RUSTSEC-2026-0459", reason = "no arti release takes the fixed libsqlite3-sys; arti opens only the database of the caller's own cache, which its check of permissions keeps to the user" },
  # paste: a proc-macro at build time, no code at run time; pod-tor brings
  # it through pwd-grp of arti's fs-mistrust (call C766). Read 2026-11-16.
  { id = "RUSTSEC-2024-0436", reason = "unmaintained build-time proc-macro, only through arti's fs-mistrust (pod-tor)" },
  # chrono and humantime, unmaintained: no fault, no safe version. chrono
  # comes only through iroh (tokio-rustls-acme of iroh-relay, wmi of
  # netwatch on Windows) for pod-iroh; humantime only through arti for
  # pod-tor. No crate of podcrates names either. Remove each ignore when
  # iroh and arti drop them (call C776, T-852). Read 2026-11-17.
  { id = "RUSTSEC-2026-0543", reason = "chrono is unmaintained, with no known fault; only iroh brings it (pod-iroh)" },
  { id = "RUSTSEC-2026-0542", reason = "humantime is unmaintained, with no known fault; only arti brings it (pod-tor)" },
]

[licenses]
version = 2
confidence-threshold = 0.93
# LGPL and GPL are not allowed: the binaries of the consumers are static.
allow = [
  "0BSD",
  "Apache-2.0",
  "BSD-2-Clause",
  "BSD-3-Clause",
  "CDLA-Permissive-2.0",
  "ISC",
  "MIT",
  "Unicode-3.0",
  "Zlib",
]

# The crates of arti under pod-tor (T-038, call C766), each unchanged and
# named: copyleft for each file (MPL-2.0: option-ext), two dedications to the public
# domain (Unlicense, CC0-1.0) and Boost's permissive license (BSL-1.0, of
# tor-hsservice's growable-bloom-filter). A consumer that links pod-tor ships
# the notice of each.
exceptions = [
  { allow = ["MPL-2.0"], crate = "option-ext" },
  { allow = ["Unlicense"], crate = "async_executors" },
  { allow = ["CC0-1.0"], crate = "notify" },
  { allow = ["BSL-1.0"], crate = "xxhash-rust" },
  # MIT with no notice clause, under boon (the JSON Schema validator of the
  # feature `schema` of pod-testkit, T-104; call C795).
  { allow = ["MIT-0"], crate = "borrow-or-share" },
]

[bans]
multiple-versions = "warn"
wildcards = "deny"
# The crates of the workspace are paths with a version.
allow-wildcard-paths = true

[sources]
unknown-registry = "deny"
unknown-git = "deny"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]
# The forks are in vendor/ as paths. A git source needs a decision.
allow-git = []
