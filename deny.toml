# cargo-deny: the advisories, licenses, duplicate versions and sources of
# the dependencies. CI runs it (.github/workflows/deny.yml). By hand:
#
#   cargo deny --all-features --locked check advisories licenses bans sources

[graph]
all-features = true
# The release targets of the consumers (docs/design.md, Targets). A crate
# that only another target compiles is in no release, and is not checked.
targets = [
  "x86_64-unknown-linux-musl",
  "aarch64-unknown-linux-musl",
  "armv7-unknown-linux-musleabihf",
  "riscv64gc-unknown-linux-musl",
  "i686-unknown-linux-musl",
  "arm-unknown-linux-musleabihf",
  "loongarch64-unknown-linux-musl",
  "powerpc64le-unknown-linux-musl",
  "x86_64-unknown-linux-gnu",
  "aarch64-unknown-linux-gnu",
  "x86_64-apple-darwin",
  "aarch64-apple-darwin",
  "x86_64-pc-windows-msvc",
  "aarch64-pc-windows-msvc",
]

[advisories]
version = 2
yanked = "deny"
# Each ignored advisory has its reason and the date it was read.
ignore = [
  # rsa 0.9, feature rsa of pod-tls (read 2026-11-05): a timing attack on
  # the operations with a private key. pod-tls verifies signatures with
  # public keys only (docs/design.md, section 2). rsa 0.10.0-rc, under
  # russh of pod-services-watch (call C88), is a pre-release of the patched
  # 0.10.0: the watch verifies the RSA host key of a relay with its public
  # key, and its own key is Ed25519.
  { id = "RUSTSEC-2023-0071", reason = "pod-tls and the russh client of pod-services-watch verify with RSA public keys only; the advisory concerns private-key operations" },
]

[licenses]
version = 2
confidence-threshold = 0.93
# LGPL and GPL are not allowed: the binaries of the consumers are static.
allow = [
  "0BSD",
  "Apache-2.0",
  "BSD-2-Clause",
  "BSD-3-Clause",
  "CDLA-Permissive-2.0",
  "ISC",
  "MIT",
  "Unicode-3.0",
  "Zlib",
]

[bans]
multiple-versions = "warn"
wildcards = "deny"
# The crates of the workspace are paths with a version.
allow-wildcard-paths = true

[sources]
unknown-registry = "deny"
unknown-git = "deny"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]
# The forks are in vendor/ as paths. A git source needs a decision.
allow-git = []
